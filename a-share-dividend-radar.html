<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>APLUS A股股息率雷达</title>
<link rel="stylesheet" href="a-share-dividend-radar-v1.css">
<link rel="stylesheet" href="a-share-dividend-analysis-v1.css">
<link rel="stylesheet" href="a-share-dividend-radar-layout-v1.css">
<style>.brand-lockup{display:flex;align-items:center;gap:14px;margin-bottom:12px}.brand-lockup img{width:62px;height:62px;object-fit:contain;border-radius:50%}.brand-lockup span{font-size:20px;font-weight:900;letter-spacing:.5px;color:#17372e}.hero .eyebrow{margin-bottom:0}</style></head>
<body>
<main class="page">
<header class="hero">
  <div>
    <div class="brand-lockup"><img src="assets/sg-fat-uncle-stock-motor.svg" alt="狮城胖叔的股票小马达"><span>狮城胖叔的股票小马达</span></div>
    <h1>A股股息率雷达</h1>
    <p class="subtitle">全市场 · 实时价格 · 股息率 · 实时PE · 目标价</p>
  </div>
  <div class="status-wrap">
    <span id="marketStatus" class="status">正在加载…</span>
    <span id="lastUpdated" class="updated">等待数据</span>
  </div>
</header>

<section class="search-panel">
  <div class="search-box">
    <label for="stockSearch">搜索股票</label>
    <input id="stockSearch" type="search" placeholder="输入股票代码或股票名称，例如 600350 / 山东高速">
  </div>
  <div class="filter">
    <label for="yieldFilter">最低股息率</label>
    <select id="yieldFilter">
      <option value="0">全部</option>
      <option value="3">≥ 3%</option>
      <option value="4">≥ 4%</option>
      <option value="5">≥ 5%</option>
      <option value="6">≥ 6%</option>
      <option value="8">≥ 8%</option>
    </select>
  </div>
  <div class="filter">
    <label for="sortBy">排序</label>
    <select id="sortBy">
      <option value="yield">股息率高 → 低</option>
      <option value="price">股价低 → 高</option>
      <option value="change">今日涨跌幅</option>
      <option value="code">股票代码</option>
      <option value="name">股票名称</option>
    </select>
  </div>
</section>

<section class="stats" id="stats"></section>

<section class="table-card">
  <div class="table-head">
    <strong id="resultCount">A股股票</strong>
    <span>股息率 = 最近12个月现金分红 / 最新股价</span>
  </div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>股票名称</th><th>实时股价</th><th>涨跌</th><th>股息率</th><th>实时PE</th>
          <th>4.5%目标价</th><th>5%目标价</th><th>6%目标价</th>
        </tr>
      </thead>
      <tbody id="radarBody"></tbody>
    </table>
  </div>
</section>

</main>
<script src="a-share-dividend-radar-v1.js?v=100"></script>
<script src="a-share-dividend-quality-v2.js?v=3"></script>
</body>
</html>
