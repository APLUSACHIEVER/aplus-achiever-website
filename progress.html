<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APLUS ACHIEVER — My Progress</title>
<style>
:root{--g:#146b4f;--g2:#27a66d;--deep:#103e31;--muted:#6d817a;--line:#dcebe5}
body{margin:0;background:#f4f8f6;color:#183f35;font-family:Inter,Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:25px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:950;color:var(--g)}button{border:1px solid var(--line);background:#fff;color:var(--g);border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.stat b{font-size:25px;color:var(--g);display:block}.muted{color:var(--muted);font-size:12px}.card{margin-top:14px}.bar{height:9px;background:#e5efe9;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e8f0ed}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
<script src="config/supabase-config.js"></script><script src="js/auth.js"></script>
</head>
<body><div class="wrap">
<div class="top"><div><div class="brand">APLUS ACHIEVER</div><h1>My Learning Progress</h1></div><div><button onclick="location.href='vocabulary.html'">← Learning</button> <button onclick="logout()">Sign Out</button></div></div>
<div id="status" class="muted">Loading...</div>
<div class="grid">
<div class="stat"><b id="q">0</b><span class="muted">Questions</span></div>
<div class="stat"><b id="acc">0%</b><span class="muted">Accuracy</span></div>
<div class="stat"><b id="master">0</b><span class="muted">Mastered</span></div>
<div class="stat"><b id="due">0</b><span class="muted">Review Due</span></div>
<div class="stat"><b id="streak">0</b><span class="muted">Study Days</span></div>
</div>
<div class="card"><h2>Mastery Overview</h2><div id="mastery"></div></div>
<div class="card"><h2>Words Needing Attention</h2><table><thead><tr><th>Word</th><th>Level</th><th>Mastery</th><th>Accuracy</th><th>Next Review</th></tr></thead><tbody id="weak"></tbody></table></div>
</div>
<script>
async function wait(){for(let i=0;i<60;i++){if(window.APLUS_AUTH)return;await new Promise(r=>setTimeout(r,250))}}
async function logout(){await wait();await APLUS_AUTH.signOut();location.href='student-login.html'}
async function init(){
 await wait();
 const u=await APLUS_AUTH.user(); if(!u){location.href='student-login.html';return}
 const p=await APLUS_AUTH.profile();
 const s=window.aplusSupabase;
 const {data:a}=await s.from('attempts').select('is_correct,created_at').eq('student_id',u.id);
 const {data:v}=await s.from('vocabulary_progress').select('*').eq('student_id',u.id);
 const total=a?.length||0, correct=(a||[]).filter(x=>x.is_correct).length;
 q.textContent=total;acc.textContent=(total?Math.round(correct/total*100):0)+'%';
 master.textContent=(v||[]).filter(x=>Number(x.mastery)>=90).length;
 due.textContent=(v||[]).filter(x=>x.next_review&&new Date(x.next_review)<=new Date()).length;
 const days=new Set((a||[]).map(x=>x.created_at.slice(0,10)));streak.textContent=days.size;
 status.textContent='Signed in as '+(p?.full_name||u.email);
 const buckets={};
 (v||[]).forEach(x=>{const l=x.level||1;(buckets[l]??={n:0,c:0});buckets[l].n++;buckets[l].c+=Number(x.mastery||0)});
 mastery.innerHTML=Array.from({length:10},(_,i)=>{let x=buckets[i+1]||{n:0,c:0};let pct=x.n?Math.round(x.c/x.n):0;return `<p><b>Level ${i+1}</b> · ${pct}%</p><div class="bar"><i style="width:${pct}%"></i></div>`}).join('');
 const rows=(v||[]).filter(x=>Number(x.mastery)<90).sort((a,b)=>Number(a.mastery)-Number(b.mastery)).slice(0,20);
 weak.innerHTML=rows.map(x=>`<tr><td><b>${escapeHtml(x.word)}</b></td><td>L${x.level||'—'}</td><td>${Math.round(x.mastery||0)}%</td><td>${x.seen?Math.round(x.correct/x.seen*100):0}%</td><td>${x.next_review?new Date(x.next_review).toLocaleDateString():'—'}</td></tr>`).join('');
}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
init();
</script></body></html>
