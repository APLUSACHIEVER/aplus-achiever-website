}

.back-link {

}

.back-link:hover {

/* =====================================================
   HERO
===================================================== */

    padding:

        38px;

}

.badge {

.mistake-button {

.review-badge {

    background: #fff1df;
    color: #a45b16;

    font-weight: 800;
    letter-spacing: 1px;
}

.result-actions {

    justify-content: center;

    flex-wrap: wrap;

.secondary-button {
    border: 1px solid #cfe4d9;
    background: white;
    color: #176448;
    padding: 15px 24px;
    border-radius: 12px;

    font-weight: 800;

}

.secondary-button:hover {

.mistake-summary {

.progress-bar {

.question {

    margin:

    border-bottom:

   OPTIONS
===================================================== */

.options {

    display: grid;

    gap: 16px;

}

.option {

        24px;

    border:

    border-radius: 16px;

    cursor: pointer;

    text-align: left;

    font-size: 18px;

.option:hover {

<!-- =====================================================
     VOCABULARY DATABASE

     DO NOT CHANGE THIS FILE.
===================================================== -->

<script src="./data/vocabulary.js"></script>


<!-- =====================================================
     DAILY 10 ENGINE
===================================================== -->

<script>

"use strict";

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let vocabularyData = [];
let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;
let reviewMode = false;

/*
 * Mistake data is stored locally in the student's browser.
 *
 * Each word has:
 *   wrong       = number of wrong attempts
 *   correct     = number of correct review attempts
 *   lastWrong   = last time the word was answered incorrectly
 *   mastered    = true after 3 successful review attempts
 */
const MISTAKE_STORAGE_KEY = "aplusAchieverPSLEVocabularyMistakesV1";


/* =====================================================
   START APPLICATION
===================================================== */

window.addEventListener(
    "load",
    function () {
        setTimeout(
            initialiseApp,
            50
        );
    }
);


/* =====================================================
   INITIALISE APP
===================================================== */

function initialiseApp() {

    try {

        if (!window.vocabulary) {
            throw new Error(
                "window.vocabulary is not available."
            );
        }

        if (!Array.isArray(window.vocabulary)) {
            throw new Error(
                "window.vocabulary is not an array."
            );
        }

        if (window.vocabulary.length === 0) {
            throw new Error(
                "The vocabulary database is empty."
            );
        }

        vocabularyData =
            window.vocabulary.filter(
                function (word) {
                    return (
                        word &&
                        word.word
                    );
                }
            );

        if (vocabularyData.length === 0) {
            throw new Error(
                "No valid vocabulary entries were found."
            );
        }

        console.log(
            "APLUS vocabulary loaded:",
            vocabularyData.length,
            "words"
        );

        updateMistakeUI();
        createDailyQuestions();
        showQuestion();

        document
            .getElementById("loading")
            .style.display =
            "none";

        document
            .getElementById("quiz")
            .style.display =
            "block";

    }

    catch (error) {

        console.error(
            "APLUS Daily 10 error:",
            error
        );

        showError(error);

    }

}


/* =====================================================
   MISTAKE STORAGE
===================================================== */

function loadMistakes() {

    try {

        const raw =
            localStorage.getItem(
                MISTAKE_STORAGE_KEY
            );

        if (!raw) {
            return {};
        }

        const data = JSON.parse(raw);

        if (!data || typeof data !== "object") {
            return {};
        }

        return data;

    } catch (error) {

        console.warn(
            "Could not read mistake data:",
            error
        );

        return {};
    }
}


function saveMistakes(data) {

    try {

        localStorage.setItem(
            MISTAKE_STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.warn(
            "Could not save mistake data:",
            error
        );
    }
}


function getMistakeKey(word) {

    /*
     * Prefer the stable vocabulary id.
     * Fall back to the word itself.
     */
    return String(
        word.id != null
            ? word.id
            : word.word
    );
}


function recordWrongAnswer(word) {

    const mistakes = loadMistakes();
    const key = getMistakeKey(word);

    if (!mistakes[key]) {

        mistakes[key] = {
            id: word.id,
            word: word.word,
            wrong: 0,
            correct: 0,
            lastWrong: 0,
            mastered: false
        };

    }

    mistakes[key].word = word.word;
    mistakes[key].wrong =
        Number(mistakes[key].wrong || 0) + 1;
    mistakes[key].lastWrong =
        Date.now();

    /*
     * A new wrong answer means the student
     * still needs this word.
     */
    mistakes[key].mastered = false;

    saveMistakes(mistakes);
    updateMistakeUI();
}


function recordCorrectReview(word) {

    const mistakes = loadMistakes();
    const key = getMistakeKey(word);

    if (!mistakes[key]) {
        return;
    }

    mistakes[key].correct =
        Number(mistakes[key].correct || 0) + 1;

    /*
     * Three successful review attempts = mastered.
     */
    if (mistakes[key].correct >= 3) {
        mistakes[key].mastered = true;
    }

    saveMistakes(mistakes);
    updateMistakeUI();
}


function getActiveMistakes() {

    const mistakes = loadMistakes();

    return Object.values(mistakes)
        .filter(function (item) {

            return (
                item &&
                item.word &&
                !item.mastered
            );

        })
        .map(function (item) {

            const vocabularyWord =
                vocabularyData.find(
                    function (word) {
                        return (
                            String(
                                word.id != null
                                    ? word.id
                                    : word.word
                            ) ===
                            String(
                                item.id != null
                                    ? item.id
                                    : item.word
                            )
                        );
                    }
                );

            if (!vocabularyWord) {
                return null;
            }

            return {
                word: vocabularyWord,
                stats: item
            };

        })
        .filter(Boolean);
}


function getMistakeCount() {
    return getActiveMistakes().length;
}


function updateMistakeUI() {

    const count =
        getMistakeCount();

    const countElement =
        document.getElementById(
            "mistakeCount"
        );

    if (countElement) {
        countElement.textContent =
            count;
    }

    const button =
        document.getElementById(
            "mistakeButton"
        );

    if (button) {
        button.disabled =
            count === 0;
    }

    const resultButton =
        document.getElementById(
            "reviewResultButton"
        );

    if (resultButton) {
        resultButton.disabled =
            count === 0;
    }
}


/* =====================================================
   START MISTAKE REVIEW
===================================================== */

function startMistakeReview() {

    const active =
        getActiveMistakes();

    if (!active.length) {

        alert(
            "Great! You have no active mistakes to review. 🎉"
        );

        return;
    }

    reviewMode = true;
    currentQuestion = 0;
    score = 0;
    questions = [];

    /*
     * Sort by:
     * 1. higher wrong count first
     * 2. older mistakes first
     *
     * This makes the hardest words appear earlier.
     */
    active.sort(
        function (a, b) {

            const wrongA =
                Number(
                    a.stats.wrong || 0
                );

            const wrongB =
                Number(
                    b.stats.wrong || 0
                );

            if (wrongA !== wrongB) {
                return wrongB - wrongA;
            }

            return (
                Number(
                    a.stats.lastWrong || 0
                ) -
                Number(
                    b.stats.lastWrong || 0
                )
            );
        }
    );

    /*
     * Review up to 10 words at a time.
     */
    const selected =
        active.slice(0, 10);

    questions =
        selected.map(
            function (item) {

                /*
                 * Use the normal question engine,
                 * while keeping the original vocabulary
                 * record untouched.
                 */
                return createQuestion(
                    item.word,
                    Number(item.word.level) || 1
                );

            }
        );

    document
        .getElementById("result")
        .style.display =
        "none";

    document
        .getElementById("quiz")
        .style.display =
        "block";

    document
        .getElementById("reviewBadge")
        .style.display =
        "inline-block";

    showQuestion();
}


/* =====================================================
   EXIT REVIEW MODE
===================================================== */

function exitReviewMode() {

    reviewMode = false;

    document
        .getElementById("reviewBadge")
        .style.display =
        "none";

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

    document
        .getElementById("loading")
        .style.display =
        "none";

    document
        .getElementById("quiz")
        .style.display =
        "none";

    document
        .getElementById("errorBox")
        .style.display =
        "block";

    document
        .getElementById("errorMessage")
        .innerHTML =

        "Please check that your GitHub files are arranged as:<br><br>" +

        "<strong>index.html</strong><br>" +

        "└── <strong>data/vocabulary.js</strong><br><br>" +

        "Technical message: " +

        escapeHTML(
            error.message
        );

}


/* =====================================================
   CREATE DAILY QUESTIONS
===================================================== */

function createDailyQuestions() {

    questions = [];

    for (
        let level = 1;
        level <= 10;
        level++
    ) {

        let pool =
            vocabularyData.filter(
                function (word) {

                    return (
                        Number(word.level) ===
                        level
                    );

                }
            );

        if (pool.length === 0) {

            pool =
                vocabularyData;

        }

        let word =
            pool[
                Math.floor(
                    Math.random() *
                    pool.length
                )
            ];

        questions.push(
            createQuestion(
                word,
                level
            )
        );

    }

}


/* =====================================================
   CREATE QUESTION
===================================================== */

function createQuestion(
    word,
    level
) {

    let type =
        level <= 3
            ? "meaning"
            : randomChoice(
                [
                    "meaning",
                    "synonym",
                    "context"
                ]
            );

    if (type === "synonym") {

        return createSynonymQuestion(
            word,
            level
        );

    }

    if (type === "context") {

        return createContextQuestion(
            word,
            level
        );

    }

    return createMeaningQuestion(
        word,
        level
    );

}


/* =====================================================
   MEANING QUESTION
===================================================== */

function createMeaningQuestion(
    word,
    level
) {

    let correct =
        getCorrectMeaning(word);

    let wrongAnswers =
        getWrongMeanings(
            word,
            3
        );

    let options =
        shuffle(
            [
                correct,
                ...wrongAnswers
            ]
        );

    return {

        level: level,
        word: word,
        type: "meaning",

        question:
            'What does "' +
            escapeHTML(word.word) +
            '" mean?',

        answer: correct,
        options: options,

        explanation:
            getExplanation(word)

    };

}


/* =====================================================
   SYNONYM QUESTION
===================================================== */

function createSynonymQuestion(
    word,
    level
) {

    let correct =
        getCorrectMeaning(word);

    let wrongAnswers =
        getWrongMeanings(
            word,
            3
        );

    let options =
        shuffle(
            [
                correct,
                ...wrongAnswers
            ]
        );

    return {

        level: level,
        word: word,
        type: "synonym",

        question:
            'Which meaning is closest to "' +
            escapeHTML(word.word) +
            '"?',

        answer: correct,
        options: options,

        explanation:
            getExplanation(word)

    };

}


/* =====================================================
   CONTEXT QUESTION
===================================================== */

function createContextQuestion(
    word,
    level
) {

    let example =
        typeof word.example === "string"
            ? word.example.trim()
            : "";

    let sentence = "";

    let wordPattern =
        new RegExp(
            "\\b" +
            escapeRegExp(word.word) +
            "\\b",
            "i"
        );

    if (
        example &&
        wordPattern.test(example)
    ) {

        sentence =
            escapeHTML(example).replace(
                new RegExp(
                    "\\b" +
                    escapeRegExp(word.word) +
                    "\\b",
                    "i"
                ),
                '<span class="question-blank">&nbsp;</span>'
            );

    }

    else {

        let partOfSpeech =
            String(
                word.partOfSpeech || ""
            )
            .toLowerCase()
            .trim();

        if (
            partOfSpeech.includes("adjective")
        ) {

            sentence =
                "The student was " +
                '<span class="question-blank">&nbsp;</span>' +
                " when answering the question.";

        }

        else if (
            partOfSpeech.includes("verb")
        ) {

            sentence =
                "The teacher asked the student to " +
                '<span class="question-blank">&nbsp;</span>' +
                " the task.";

        }

        else if (
            partOfSpeech.includes("noun")
        ) {

            sentence =
                "The student showed great " +
                '<span class="question-blank">&nbsp;</span>' +
                " during the activity.";

        }

        else if (
            partOfSpeech.includes("adverb")
        ) {

            sentence =
                "The student answered the question " +
                '<span class="question-blank">&nbsp;</span>' +
                ".";

        }

        else {

            sentence =
                "The student used the word " +
                '<span class="question-blank">&nbsp;</span>' +
                " correctly.";

        }

    }

    let correct =
        word.word;

    let wrongWords =
        getWrongWords(
            word,
            3
        );

    let options =
        shuffle(
            [
                correct,
                ...wrongWords
            ]
        );

    return {

        level: level,
        word: word,
        type: "context",

        question:
            "Choose the word that best completes the sentence:<br><br>" +
            sentence,

        answer: correct,
        options: options,

        explanation:
            getExplanation(word)

    };

}


/* =====================================================
   CORRECT MEANING
===================================================== */

function getCorrectMeaning(word) {

    if (
        word.meaning &&
        String(word.meaning).trim()
    ) {

        return String(
            word.meaning
        ).trim();

    }

    if (
        word.chinese &&
        String(word.chinese).trim()
    ) {

        return String(
            word.chinese
        ).trim();

    }

    return (
        "the meaning of the word " +
        word.word
    );

}


/* =====================================================
   WRONG MEANINGS
===================================================== */

function getWrongMeanings(
    correctWord,
    count
) {

    let candidates =
        vocabularyData.filter(
            function (item) {

                return (
                    item.id !==
                    correctWord.id
                    &&
                    (
                        item.meaning ||
                        item.chinese
                    )
                );

            }
        );

    candidates =
        shuffle(
            candidates.slice()
        );

    let results = [];

    for (
        let item of candidates
    ) {

        let meaning =
            getCorrectMeaning(item);

        if (
            meaning &&
            meaning !==
            getCorrectMeaning(
                correctWord
            )
        ) {

            results.push(
                meaning
            );

        }

        if (
            results.length >= count
        ) {

            break;

        }

    }

    while (
        results.length < count
    ) {

        results.push(
            "another possible meaning"
        );

    }

    return results;

}


/* =====================================================
   WRONG WORDS
===================================================== */

function getWrongWords(
    correctWord,
    count
) {

    let candidates =
        vocabularyData.filter(
            function (item) {

                return (
                    item.id !==
                    correctWord.id
                );

            }
        );

    candidates =
        shuffle(
            candidates.slice()
        );

    let results = [];

    for (
        let item of candidates
    ) {

        if (
            item.word &&
            item.word !==
            correctWord.word
        ) {

            results.push(
                item.word
            );

        }

        if (
            results.length >= count
        ) {

            break;

        }

    }

    while (
        results.length < count
    ) {

        results.push(
            "another word"
        );

    }

    return results;

}


/* =====================================================
   EXPLANATION
===================================================== */

function getExplanation(word) {

    let text = "";

    if (word.meaning) {

        text +=
            "Meaning: " +
            escapeHTML(
                word.meaning
            );

    }

    if (word.chinese) {

        text +=
            "<br>中文： " +
            escapeHTML(
                word.chinese
            );

    }

    if (word.example) {

        text +=
            "<br><br>Example: " +
            escapeHTML(
                word.example
            );

    }

    if (
        word.synonyms &&
        Array.isArray(word.synonyms) &&
        word.synonyms.length
    ) {

        text +=
            "<br><br>Synonyms: " +
            word.synonyms
                .map(
                    function (item) {

                        return escapeHTML(
                            item
                        );

                    }
                )
                .join(", ");

    }

    return text;
}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    answered = false;

    let q =
        questions[
            currentQuestion
        ];

    if (!q) {
        return;
    }

    document
        .getElementById("progressText")
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document
        .getElementById("levelText")
        .textContent =
        "Level " +
        q.level;

    let percentage =
        (
            (currentQuestion + 1) /
            questions.length
        ) * 100;

    document
        .getElementById("progressBar")
        .style.width =
        percentage + "%";

    document
        .getElementById("questionText")
        .innerHTML =
        q.question;

    let options =
        q.options || [];

    if (!options.length) {

        if (q.type === "context") {

            options =
                shuffle(
                    [
                        q.answer,
                        ...getWrongWords(
                            q.word,
                            3
                        )
                    ]
                );

        }

        else {

            options =
                shuffle(
                    [
                        q.answer,
                        ...getWrongMeanings(
                            q.word,
                            3
                        )
                    ]
                );

        }

        q.options =
            options;

    }

    let optionsContainer =
        document.getElementById(
            "options"
        );

    optionsContainer.innerHTML =
        "";

    options.forEach(
        function (option) {

            let button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "option";

            button.textContent =
                option;

            button.addEventListener(
                "click",
                function () {

                    checkAnswer(
                        option,
                        button
                    );

                }
            );

            optionsContainer.appendChild(
                button
            );

        }
    );

    let feedback =
        document.getElementById(
            "feedback"
        );

    feedback.className =
        "feedback";

    feedback.innerHTML =
        "";

    document
        .getElementById("nextButton")
        .style.display =
        "none";

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
    selected,
    clickedButton
) {

    if (answered) {
        return;
    }

    answered = true;

    let q =
        questions[
            currentQuestion
        ];

    let correct =
        selected ===
        q.answer;

    let buttons =
        document.querySelectorAll(
            ".option"
        );

    buttons.forEach(
        function (button) {

            button.disabled =
                true;

            if (
                button.textContent ===
                q.answer
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );

    if (correct) {

        score++;

        clickedButton.classList.add(
            "correct"
        );

        /*
         * Only count a correct answer as
         * review progress when the question
         * comes from Mistake Review.
         */
        if (reviewMode) {
            recordCorrectReview(q.word);
        }

        showFeedback(
            true,
            "Correct! ✓",
            q.explanation
        );

    }

    else {

        clickedButton.classList.add(
            "wrong"
        );

        /*
         * Every wrong answer enters or remains
         * in the mistake system.
         */
        recordWrongAnswer(q.word);

        showFeedback(
            false,
            "Not quite.",
            'The correct answer is "' +
            escapeHTML(q.answer) +
            '".<br><br>' +
            q.explanation
        );

    }

    document
        .getElementById("nextButton")
        .style.display =
        "block";

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
    correct,
    title,
    text
) {

    let feedback =
        document.getElementById(
            "feedback"
        );

    feedback.className =
        correct
            ? "feedback correct"
            : "feedback wrong";

    feedback.innerHTML =
        '<div class="feedback-title">' +
        title +
        "</div>" +
        "<div>" +
        text +
        "</div>";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    currentQuestion++;

    if (
        currentQuestion >=
        questions.length
    ) {

        showResult();

        return;

    }

    showQuestion();

}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

    document
        .getElementById("quiz")
        .style.display =
        "none";

    document
        .getElementById("result")
        .style.display =
        "block";

    document
        .getElementById("score")
        .textContent =
        score +
        " / " +
        questions.length;

    let percentage =
        Math.round(
            score /
            questions.length *
            100
        );

    let message;

    if (reviewMode) {

        if (percentage === 100) {

            message =
                "Excellent! Keep reviewing until every difficult word is mastered. 🌟";

        }

        else if (percentage >= 80) {

            message =
                "Great review session! Keep working on the remaining mistakes. 💪";

        }

        else {

            message =
                "Keep practising. Every mistake helps you learn. 🌱";

        }

    }

    else if (percentage === 100) {

        message =
            "Outstanding! Perfect score! 🌟";

    }

    else if (percentage >= 80) {

        message =
            "Excellent work! Your vocabulary is getting stronger. 💪";

    }

    else if (percentage >= 60) {

        message =
            "Good effort! Keep practising your vocabulary. 📚";

    }

    else {

        message =
            "Keep going! Every mistake is a chance to learn. 🌱";

    }

    document
        .getElementById("resultMessage")
        .textContent =
        message;

    const activeCount =
        getMistakeCount();

    const summary =
        document.getElementById(
            "mistakeSummary"
        );

    if (activeCount > 0) {

        summary.style.display =
            "block";

        summary.innerHTML =
            "<strong>" +
            activeCount +
            "</strong> active " +
            (activeCount === 1
                ? "mistake"
                : "mistakes") +
            " still need review.";

    }

    else {

        summary.style.display =
            "block";

        summary.innerHTML =
            "🎉 <strong>All active mistakes are cleared.</strong> Keep up the great work!";

    }

    const reviewButton =
        document.getElementById(
            "reviewResultButton"
        );

    reviewButton.disabled =
        activeCount === 0;

    /*
     * Daily 10 completion exits review mode.
     * Review completion also exits review mode,
     * so the result page is clean and neutral.
     */
    exitReviewMode();

}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz() {

    currentQuestion = 0;
    score = 0;
    questions = [];

    document
        .getElementById("result")
        .style.display =
        "none";

    document
        .getElementById("quiz")
        .style.display =
        "block";

    if (reviewMode) {

        startMistakeReview();

    }

    else {

        createDailyQuestions();
        showQuestion();

    }

}


/* =====================================================
   RANDOM CHOICE
===================================================== */

function randomChoice(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    for (
        let i =
            array.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* =====================================================
   ESCAPE REGEX
===================================================== */

function escapeRegExp(string) {

    return String(
        string
    ).replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
