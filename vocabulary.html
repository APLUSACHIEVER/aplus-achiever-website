<style>

* {

}

body {

/* =========================
   HEADER
========================= */

header {

.logo {

}

.logo-main {

}

.logo-sub {
    margin-top: 14px;

    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;

    color: #637c75;
}

.back-link {
    color: #087047;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

.back-link:hover {
    text-decoration: underline;
}

/* =========================
   HERO
========================= */

.hero {
    text-align: center;

    padding:
        66px
        20px
        38px;
}

.badge {
    display: inline-block;

    padding: 12px 28px;

    border-radius: 30px;

    background: #dff2e9;

    color: #126448;

    font-size: 15px;
    font-weight: 800;

    letter-spacing: 1px;
}

.hero h1 {
    margin:
        22px
        0
        12px;

    font-size: 64px;
    line-height: 1;

    color: #123c2d;
}

.hero h1 span {
    color: #27a56b;
}

.hero p {
    margin: 0;

    font-size: 21px;

    color: #657c76;
}

/* =========================
   MAIN CARD
========================= */

.container {
    width: min(1360px, 90%);

    margin:
        10px
        auto
        100px;
}

.card {
    background: white;

    border-radius: 32px;

    padding: 48px;

    box-shadow:
        0 18px 50px
        rgba(28, 80, 58, 0.08);
}

/* =========================
   TOP BAR
========================= */

.topbar {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 32px;
}

.progress-text {
    font-size: 16px;
    font-weight: 700;

    color: #57736a;
}

.level-text {
    font-size: 15px;
    font-weight: 800;

    color: #209261;
}

.progress {
    width: 100%;
    height: 9px;

    background: #e7f0eb;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 42px;
}

.progress-bar {
    height: 100%;
    width: 10%;

    background: #28a66d;

    border-radius: 20px;

    transition:
        width 0.3s ease;
}

/* =========================
   QUESTION
========================= */

.question-label {
    font-size: 14px;
    font-weight: 800;

    color: #2ba06c;

    letter-spacing: 1.5px;

    margin-bottom: 14px;
}

.question {
    font-size: 32px;
    line-height: 1.4;

    font-weight: 700;

    color: #173d2f;

    margin-bottom: 34px;
}

/* =========================
   OPTIONS
========================= */

.options {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 16px;
}

.option {
    width: 100%;

    min-height: 76px;

    padding: 18px 22px;

    border:
        2px solid #dcebe4;

    border-radius: 16px;

    background: white;

    cursor: pointer;

    text-align: left;

    font-size: 18px;
    font-weight: 600;

    color: #244a3c;

    transition:
        all 0.15s ease;
}

.option:hover {
    border-color: #42ad7c;

    background: #f3fbf7;

    transform: translateY(-1px);
}

.option.correct {
    border-color: #239660;

    background: #e3f6ec;

    color: #126448;
}

.option.wrong {
    border-color: #d76868;

    background: #fff0f0;

    color: #a73535;
}

.option:disabled {
    cursor: default;
}

/* =========================
   FEEDBACK
========================= */

.feedback {
    display: none;

    margin-top: 30px;

    padding: 22px 24px;

    border-radius: 16px;

    font-size: 17px;

    line-height: 1.6;
}

.feedback.correct {
    display: block;

    background: #eaf8f0;

    color: #176448;
}

.feedback.wrong {
    display: block;

    background: #fff1f1;

    color: #923c3c;
}

.feedback-title {
    font-size: 20px;

    font-weight: 800;

    margin-bottom: 7px;
}

/* =========================
   NEXT BUTTON
========================= */

.button-row {
    display: flex;

    justify-content: flex-end;

    margin-top: 30px;
}

.next-button {
    display: none;

    border: none;

    background: #19895d;

    color: white;

    padding: 15px 30px;

    border-radius: 12px;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;
}

.next-button:hover {
    background: #11734d;
}

/* =========================
   RESULT
========================= */

#result {
    display: none;

    text-align: center;

    padding: 30px 10px;
}

.result-title {
    font-size: 38px;

    font-weight: 800;

    margin-bottom: 20px;
}

.score {
    font-size: 70px;

    font-weight: 800;

    color: #239966;

    margin-bottom: 15px;
}

.result-message {
    font-size: 20px;

    color: #637a72;

    margin-bottom: 35px;
}

.restart-button {
    border: none;

    background: #19895d;

    color: white;

    padding: 15px 30px;

    border-radius: 12px;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;
}

/* =========================
   ERROR
========================= */

#errorBox {
    display: none;

    padding: 30px;

    border-radius: 16px;

    background: #fff1f1;

    border: 1px solid #efb2b2;

    color: #8b3030;

    line-height: 1.7;

    font-size: 16px;
}

#errorBox strong {
    display: block;

    font-size: 20px;

    margin-bottom: 10px;
}

/* =========================
   LOADING
========================= */

#loading {
    text-align: center;

    padding: 100px 20px;

    font-size: 20px;

    color: #617970;
}

.spinner {
    width: 38px;
    height: 38px;

    margin:
        0
        auto
        22px;

    border:
        4px solid #dcece5;

    border-top-color: #299d69;

    border-radius: 50%;

        spin 0.8s linear infinite;
}

@keyframes spin {

    }

}

.option {

    overflow-wrap: anywhere;
    word-break: normal;
}

.question,

}

<!-- =====================================================
     DAILY 10 ENGINE
===================================================== -->

<script>

"use strict";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let vocabularyData = [];

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =====================================================
   START
===================================================== */

window.addEventListener("error", function (event) {
    if (
        event &&
        event.target &&
        event.target.tagName === "SCRIPT" &&
        event.target.src &&
        event.target.src.includes("vocabulary.js")
    ) {
        showError(
            new Error(
                "Could not load ./data/vocabulary.js. " +
                "Check that the file exists at data/vocabulary.js " +
                "and that GitHub Pages can access it."
            )
        );
    }
}, true);

window.addEventListener(
    "load",
    function () {
        setTimeout(
            initialiseApp,
            50
        );
    }
);


/* =====================================================
   INITIALISE
===================================================== */

function initialiseApp() {

    try {

        /*
         * vocabulary.js should create:
         *
         * window.vocabulary
         */

        const rawVocabulary =
            window.vocabulary ||
            window.VOCABULARY ||
            window.vocabularyData ||
            window.Vocabulary ||
            [];

        if (!Array.isArray(rawVocabulary)) {
            throw new Error(
                "vocabulary.js loaded, but no vocabulary array was found. " +
                "Please make sure it contains: window.vocabulary = [...];"
            );
        }

        if (rawVocabulary.length === 0) {
            throw new Error(
                "The vocabulary database is empty."
            );
        }

        vocabularyData =
            rawVocabulary.filter(
                word =>
                    word &&
                    typeof word.word === "string" &&
                    word.word.trim()
            );


        if (
            vocabularyData.length === 0
        ) {

            throw new Error(
                "No valid vocabulary entries were found."
            );

        }


        console.log(
            "APLUS vocabulary loaded:",
            vocabularyData.length,
            "words"
        );


        createDailyQuestions();


        showQuestion();


        document
            .getElementById(
                "loading"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "quiz"
            )
            .style.display =
            "block";

    }

    catch (error) {

        console.error(
            "APLUS Daily 10 error:",
            error
        );

        showError(
            error
        );

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

    document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "quiz"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "errorBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "errorMessage"
        )
        .innerHTML =

        "Please check that your GitHub files are arranged as:<br><br>" +

        "<strong>index.html</strong><br>" +

        "└── <strong>data/vocabulary.js</strong><br><br>" +

        "Technical message: " +

        escapeHTML(
            error.message
        );

}


/* =====================================================
   CREATE DAILY QUESTIONS
===================================================== */

function createDailyQuestions() {

    questions = [];


    /*
     * We want exactly 10 questions.
     *
     * Level 1 → Level 10
     *
     * Therefore each question comes
     * from a different difficulty level.
     */


    for (
        let level = 1;
        level <= 10;
        level++
    ) {

        let pool =
            vocabularyData.filter(
                word =>
                    Number(word.level) === level
            );


        /*
         * If a level is missing,
         * use the complete vocabulary
         * as a fallback.
         */

        if (
            pool.length === 0
        ) {

            pool =
                vocabularyData;

        }


        let word =
            pool[
                Math.floor(
                    Math.random() *
                    pool.length
                )
            ];


        questions.push(
            createQuestion(
                word,
                level
            )
        );

    }

}


/* =====================================================
   CREATE QUESTION
===================================================== */

function createQuestion(
    word,
    level
) {

    /*
     * Three question styles:
     *
     * meaning
     * synonym
     * context
     */


    let type =
        level <= 3
            ? "meaning"
            : randomChoice(
                [
                    "meaning",
                    "synonym",
                    "context"
                ]
            );


    if (
        type === "synonym"
    ) {

        let correct =
            getCorrectMeaning(
                word
            );


        return {

            level:
                level,

            word:
                word,

            question:
                'Which word is closest in meaning to "' +
                word.word +
                '"?',

            answer:
                correct,

            options:
                shuffle([
                    correct,
                    ...getWrongMeanings(word, 3)
                ]),

            explanation:
                getExplanation(
                    word
                )

        };

    }


    if (
        type === "context"
    ) {

        return createContextQuestion(
            word,
            level
        );

    }


    return createMeaningQuestion(
        word,
        level
    );

}


/* =====================================================
   MEANING QUESTION
===================================================== */

function createMeaningQuestion(
    word,
    level
) {

    let correct =
        getCorrectMeaning(
            word
        );


    let wrongAnswers =
        getWrongMeanings(
            word,
            3
        );


    let options =
        shuffle(
            [
                correct,
                ...wrongAnswers
            ]
        );


    return {

        level:
            level,

        word:
            word,

        question:
            'What does "' +
            word.word +
            '" mean?',

        answer:
            correct,

        options:
            options,

        explanation:
            getExplanation(
                word
            )

    };

}


/* =====================================================
   CONTEXT QUESTION
===================================================== */

function createContextQuestion(
    word,
    level
) {

    let example =
        word.example ||
        (
            "The student used the word " +
            word.word +
            " correctly."
        );


    /*
     * Replace the word with a blank.
     */

    let sentence =
        example.replace(
            new RegExp(
                "\\b" +
                escapeRegExp(
                    word.word
                ) +
                "\\b",
                "i"
            ),
            "_____"
        );


    /*
     * If the example doesn't
     * contain the word, create
     * a simple sentence.
     */

    if (
        sentence === example
    ) {

        sentence =
            "The student was " +
            word.word +
            " when answering the question.";

    }


    let correct =
        word.word;


    let wrongWords =
        getWrongWords(
            word,
            3
        );


    let options =
        shuffle(
            [
                correct,
                ...wrongWords
            ]
        );


    return {

        level:
            level,

        word:
            word,

        question:
            "Choose the word that best completes the sentence:<br><br>" +
            sentence,

        answer:
            correct,

        options:
            options,

        explanation:
            getExplanation(
                word
            )

    };

}


/* =====================================================
   CORRECT MEANING
===================================================== */

function getCorrectMeaning(
    word
) {

    if (
        word.meaning &&
        word.meaning.trim()
    ) {

        return word.meaning;

    }


    if (
        word.chinese &&
        word.chinese.trim()
    ) {

        return word.chinese;

    }


    /*
     * Fallback so the question
     * never breaks.
     */

    return (
        "the meaning of the word " +
        word.word
    );

}


/* =====================================================
   WRONG MEANINGS
===================================================== */

function getWrongMeanings(
    correctWord,
    count
) {

    let candidates =
        vocabularyData
            .filter(
                item =>
                    item.id !==
                    correctWord.id &&
                    (
                        item.meaning ||
                        item.chinese
                    )
            );


    candidates =
        shuffle(
            candidates.slice()
        );


    let results = [];


    for (
        let item of candidates
    ) {

        let meaning =
            getCorrectMeaning(
                item
            );


        if (
            meaning &&
            meaning !==
            getCorrectMeaning(
                correctWord
            )
        ) {

            results.push(
                meaning
            );

        }


        if (
            results.length >=
            count
        ) {

            break;

        }

    }


    /*
     * Safety fallback.
     */

    while (
        results.length < count
    ) {

        results.push(
            "another possible meaning"
        );

    }


    return results;

}


/* =====================================================
   WRONG WORDS
===================================================== */

function getWrongWords(
    correctWord,
    count
) {

    let candidates =
        vocabularyData
            .filter(
                item =>
                    item.id !==
                    correctWord.id
            );


    candidates =
        shuffle(
            candidates.slice()
        );


    const results = candidates
        .slice(0, count)
        .map(item => item.word)
        .filter(Boolean);

    while (results.length < count) {
        results.push("another word");
    }

    return results;

}


/* =====================================================
   EXPLANATION
===================================================== */

function getExplanation(
    word
) {

    let text = "";


    if (
        word.meaning
    ) {

        text +=
            "Meaning: " +
            word.meaning;

    }


    if (
        word.chinese
    ) {

        text +=
            "<br>中文： " +
            word.chinese;

    }


    if (
        word.example
    ) {

        text +=
            "<br><br>Example: " +
            word.example;

    }


    if (
        word.synonyms &&
        word.synonyms.length
    ) {

        text +=
            "<br><br>Synonyms: " +
            word.synonyms.join(
                ", "
            );

    }


    return text;

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    answered = false;


    let q =
        questions[
            currentQuestion
        ];


    if (!q) {

        return;

    }


    document
        .getElementById(
            "progressText"
        )
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    document
        .getElementById(
            "levelText"
        )
        .textContent =
        "Level " +
        q.level;


    let percentage =
        (
            (currentQuestion + 1) /
            questions.length
        ) * 100;


    document
        .getElementById(
            "progressBar"
        )
        .style.width =
        percentage + "%";


    document
        .getElementById(
            "questionText"
        )
        .innerHTML =
        q.question;


    let options =
        q.options ||
        [];


    /*
     * Meaning questions already have
     * options.
     *
     * Synonym questions need options.
     */

    if (
        !q.options
    ) {

        let correct =
            q.answer;


        let wrong =
            getWrongMeanings(
                q.word,
                3
            );


        options =
            shuffle(
                [
                    correct,
                    ...wrong
                ]
            );


        q.options =
            options;

    }


    let optionsContainer =
        document.getElementById(
            "options"
        );


    optionsContainer.innerHTML =
        "";


    options.forEach(
        function(option) {

            let button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.textContent =
                option;


            button.onclick =
                function() {

                    checkAnswer(
                        option,
                        button
                    );

                };


            optionsContainer.appendChild(
                button
            );

        }
    );


    document
        .getElementById(
            "feedback"
        )
        .className =
        "feedback";


    document
        .getElementById(
            "feedback"
        )
        .innerHTML =
        "";


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "none";

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
    selected,
    clickedButton
) {

    if (
        answered
    ) {

        return;

    }


    answered = true;


    let q =
        questions[
            currentQuestion
        ];


    let correct =
        selected ===
        q.answer;


    let buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(button) {

            button.disabled =
                true;


            if (
                button.textContent ===
                q.answer
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    if (
        correct
    ) {

        score++;


        clickedButton.classList.add(
            "correct"
        );


        showFeedback(
            true,
            "Correct! ✓",
            q.explanation
        );

    }

    else {

        clickedButton.classList.add(
            "wrong"
        );


        showFeedback(
            false,
            "Not quite.",
            'The correct answer is "' +
            q.answer +
            '".<br><br>' +
            q.explanation
        );

    }


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "block";

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
    correct,
    title,
    text
) {

    let feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        correct
            ? "feedback correct"
            : "feedback wrong";


    feedback.innerHTML =
        '<div class="feedback-title">' +
        title +
        "</div>" +
        "<div>" +
        text +
        "</div>";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    /*
     * V6 stability guard:
     * Never advance before an answer has been submitted.
     */

    if (!answered) {
        return;
    }

    currentQuestion++;

    if (
        currentQuestion >=
        questions.length
    ) {

        showResult();

        return;

    }

    showQuestion();

}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

    document
        .getElementById(
            "quiz"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "score"
        )
        .textContent =
        score +
        " / " +
        questions.length;


    let percentage =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if (
        percentage ===
        100
    ) {

        message =
            "Outstanding! Perfect score! 🌟";

    }

    else if (
        percentage >= 80
    ) {

        message =
            "Excellent work! Your vocabulary is getting stronger. 💪";

    }

    else if (
        percentage >= 60
    ) {

        message =
            "Good effort! Keep practising your vocabulary. 📚";

    }

    else {

        message =
            "Keep going! Every mistake is a chance to learn. 🌱";

    }


    document
        .getElementById(
            "resultMessage"
        )
        .textContent =
        message;

}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    questions = [];


    document
        .getElementById(
            "result"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "quiz"
        )
        .style.display =
        "block";


    createDailyQuestions();

    showQuestion();

}


/* =====================================================
   RANDOM CHOICE
===================================================== */

function randomChoice(
    array
) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(
    array
) {

    for (
        let i =
            array.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =====================================================
   ESCAPE REGEX
===================================================== */

function escapeRegExp(
    string
) {

    return String(
        string
    ).replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


<script>
/* =====================================================
   APLUS ACHIEVER V6 — ADAPTIVE SPACED REPETITION ENGINE
===================================================== */

(function(){
    "use strict";

    const V6_KEY = "aplusAchieverPSLEV6SRSV1";
    let v6Mode = "daily";

    function loadSRS(){
        try{
            const raw = localStorage.getItem(V6_KEY);
            return raw ? JSON.parse(raw) : {};
        }catch(e){ return {}; }
    }

    function saveSRS(data){
        try{ localStorage.setItem(V6_KEY, JSON.stringify(data)); }catch(e){}
    }

    function getCard(word){
        const data = loadSRS();
        if(!data[word.word]){
            data[word.word] = {
                word:word.word,
                id:word.id || word.word,
                level:Number(word.level || 1),
                seen:0, correct:0, wrong:0, streak:0,
                stage:0, interval:0, ease:2.3,
                lastAnswered:0, lastCorrect:0, lastWrong:0,
                nextReview:Date.now()
            };
            saveSRS(data);
        }
        return data[word.word];
    }

    function recordSRS(word, correct){
        if(!word || !word.word) return;

        const data = loadSRS();
        const c = data[word.word] || getCard(word);
        const intervals = [1,3,7,14,30,60];

        c.level = Number(word.level || c.level || 1);
        c.seen++;
        c.lastAnswered = Date.now();

        if(correct){
            c.correct++;
            c.streak++;
            c.lastCorrect = Date.now();
            c.stage = Math.min(5, Number(c.stage || 0) + 1);
            c.interval = intervals[c.stage] || 60;
            c.ease = Math.min(2.8, Number(c.ease || 2.3) + 0.05);
            c.nextReview = Date.now() + c.interval * 86400000;
        }else{
            c.wrong++;
            c.streak = 0;
            c.lastWrong = Date.now();
            c.stage = Math.max(0, Number(c.stage || 0) - 2);
            c.interval = 0;
            c.ease = Math.max(1.6, Number(c.ease || 2.3) - 0.15);
            c.nextReview = Date.now() + 2 * 3600000;
        }

        data[word.word] = c;
        saveSRS(data);
        updateV6DueCount();
    }

    function allCards(){
        return Object.values(loadSRS());
    }

    function vocabularyMap(){
        const map = {};
        (window.vocabulary || window.vocabularyData || []).forEach(function(w){
            if(w && w.word) map[w.word] = w;
        });
        return map;
    }

    function dueCards(){
        const now = Date.now();
        return allCards()
            .filter(function(c){ return Number(c.nextReview || 0) <= now; })
            .sort(function(a,b){
                const sa = Number(a.wrong||0)*3 - Number(a.streak||0);
                const sb = Number(b.wrong||0)*3 - Number(b.streak||0);
                return sb-sa || Number(a.nextReview||0)-Number(b.nextReview||0);
            });
    }

    function makeQuestion(word){
        return createQuestion(word, Number(word.level || 1));
    }

    function startMode(mode, words, label){
        if(!words.length){
            alert("No suitable words are available for this review yet.");
            return;
        }

        questions = words.map(makeQuestion);
        currentQuestion = 0;
        score = 0;
        answered = false;
        v6Mode = mode;

        const badge = document.getElementById("v6ModeBadge");
        if(badge){
            badge.textContent = label;
            badge.style.display = "inline-block";
        }

        document.getElementById("result").style.display = "none";
        document.getElementById("quiz").style.display = "block";
        showQuestion();
    }

    window.startDueReview = function(){
        const map = vocabularyMap();
        const words = dueCards()
            .map(function(c){ return map[c.word]; })
            .filter(Boolean)
            .slice(0,10);

        if(!words.length){
            alert("You are fully caught up — no words are due right now.");
            return;
        }
        startMode("due", words, "SPACED REPETITION — DUE NOW");
    };

    window.startWeakReview = function(){
        const map = vocabularyMap();
        const words = allCards()
            .filter(function(c){ return Number(c.wrong||0) > 0; })
            .sort(function(a,b){
                return (Number(b.wrong||0)-Number(b.streak||0)) -
                       (Number(a.wrong||0)-Number(a.streak||0));
            })
            .map(function(c){ return map[c.word]; })
            .filter(Boolean)
            .slice(0,10);

        if(!words.length){
            alert("No weak words yet. Complete some Daily 10 questions first.");
            return;
        }
        startMode("weak", words, "TARGETED WEAK-WORD REVIEW");
    };

    window.startChallengeReview = function(){
        const pool = (window.vocabulary || window.vocabularyData || [])
            .filter(function(w){ return w && Number(w.level||1) >= 7; });

        shuffle(pool);
        startMode("challenge", pool.slice(0,10), "CHALLENGE — LEVEL 7–10");
    };

    window.openV6Dashboard = function(){
        const cards = allCards();
        const due = dueCards();
        const seen = cards.filter(function(c){ return c.seen > 0; });
        const mastered = cards.filter(function(c){ return Number(c.stage||0) >= 5; });
        const correct = cards.reduce(function(s,c){ return s+Number(c.correct||0); },0);
        const wrong = cards.reduce(function(s,c){ return s+Number(c.wrong||0); },0);
        const total = correct + wrong;
        const acc = total ? Math.round(correct/total*100) : 0;

        const weak = cards
            .filter(function(c){ return Number(c.wrong||0) > 0; })
            .sort(function(a,b){ return Number(b.wrong||0)-Number(a.wrong||0); })
            .slice(0,10);

        const content = `
            <h2>📊 APLUS Vocabulary Dashboard</h2>
            <div class="v6-stats">
                <div class="v6-stat">Due Now<strong>${due.length}</strong></div>
                <div class="v6-stat">Words Seen<strong>${seen.length}</strong></div>
                <div class="v6-stat">Mastered<strong>${mastered.length}</strong></div>
                <div class="v6-stat">Accuracy<strong>${acc}%</strong></div>
            </div>
            <h3>🧠 Spaced Repetition</h3>
            <p>
                Correct answers move a word through
                <strong>1 → 3 → 7 → 14 → 30 → 60 days</strong>.
                A wrong answer brings it back for short-term review.
            </p>
            <h3>🎯 Top Weak Words</h3>
            <div class="v6-list">
                ${
                    weak.length
                    ? weak.map(function(c){
                        return `<div class="v6-row">
                            <span>${escapeHTML(c.word)}</span>
                            <span class="v6-pill">${Number(c.wrong||0)} mistakes</span>
                        </div>`;
                    }).join("")
                    : "<p>No weak words recorded yet.</p>"
                }
            </div>
            <div style="margin-top:18px;">
                <button class="v6-action" onclick="startDueReview()">Review Due</button>
                <button class="v6-action secondary" onclick="startWeakReview()">Weak Words</button>
                <button class="v6-action secondary" onclick="startChallengeReview()">Challenge</button>
            </div>
        `;

        openV6Overlay(content);
    };

    function openV6Overlay(content){
        const o = document.getElementById("v6Overlay");
        const c = document.getElementById("v6OverlayContent");
        if(!o || !c) return;
        c.innerHTML = content;
        o.style.display = "flex";
    }

    window.closeV6Overlay = function(){
        const o = document.getElementById("v6Overlay");
        if(o) o.style.display = "none";
    };

    function updateV6DueCount(){
        const el = document.getElementById("v6DueCount");
        if(el) el.textContent = dueCards().length;
    }

    /*
     * Wrap the original answer function without changing its feedback,
     * scoring, or button behaviour.
     */
    const originalCheckAnswer = window.checkAnswer;

    window.checkAnswer = function(selected, clickedButton){
        const q = questions[currentQuestion];

        if(!q || answered){
            return;
        }

        originalCheckAnswer(selected, clickedButton);

        if(answered && q.word){
            recordSRS(q.word, selected === q.answer);
        }
    };

    document.addEventListener("keydown", function(e){
        if(e.key === "Escape"){
            closeV6Overlay();
        }

        if(
            (e.key === "Enter" || e.key === " ") &&
            answered &&
            document.getElementById("nextButton") &&
            document.getElementById("nextButton").style.display !== "none"
        ){
            e.preventDefault();
            nextQuestion();
        }
    });

    window.addEventListener("load", function(){
        setTimeout(updateV6DueCount, 300);
    });

})();
</script>

</body>
