    font-weight: 600;

    color: #244a3c;

    transition:

}

.option:hover {
    border-color: #42ad7c;

    background: #f3fbf7;

    transform: translateY(-1px);
}

.option.correct {
    border-color: #239660;

    background: #e3f6ec;

    color: #126448;
}

.option.wrong {
    border-color: #d76868;

    background: #fff0f0;

    color: #a73535;
}

    color: white;

    font-weight: 800;

.result-title {

.result-message {

#errorBox {

<!-- =====================================================
     DAILY 10 ENGINE
===================================================== -->

<script>

"use strict";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let vocabularyData = [];

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =====================================================
   START
===================================================== */

window.addEventListener(
    "load",
    function () {

        setTimeout(
            initialiseApp,
            50
        );

    }
);


/* =====================================================
   INITIALISE
===================================================== */

function initialiseApp() {

    try {

        /*
         * vocabulary.js should create:
         *
         * window.vocabulary
         */

        if (
            !window.vocabulary
        ) {

            throw new Error(
                "window.vocabulary is not available."
            );

        }


        if (
            !Array.isArray(
                window.vocabulary
            )
        ) {

            throw new Error(
                "window.vocabulary is not an array."
            );

        }


        if (
            window.vocabulary.length === 0
        ) {

            throw new Error(
                "The vocabulary database is empty."
            );

        }


        vocabularyData =
            window.vocabulary
                .filter(
                    word =>
                        word &&
                        word.word
                );


        if (
            vocabularyData.length === 0
        ) {

            throw new Error(
                "No valid vocabulary entries were found."
            );

        }


        console.log(
            "AP​LUS vocabulary loaded:",
            vocabularyData.length,
            "words"
        );


        createDailyQuestions();


        showQuestion();


        document
            .getElementById(
                "loading"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "quiz"
            )
            .style.display =
            "block";

    }

    catch (error) {

        console.error(
            "APLUS Daily 10 error:",
            error
        );

        showError(
            error
        );

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

    document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "quiz"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "errorBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "errorMessage"
        )
        .innerHTML =

        "Please check that your GitHub files are arranged as:<br><br>" +

        "<strong>index.html</strong><br>" +

        "└── <strong>data/vocabulary.js</strong><br><br>" +

        "Technical message: " +

        escapeHTML(
            error.message
        );

}


/* =====================================================
   CREATE DAILY QUESTIONS
===================================================== */

function createDailyQuestions() {

    questions = [];


    /*
     * We want exactly 10 questions.
     *
     * Level 1 → Level 10
     *
     * Therefore each question comes
     * from a different difficulty level.
     */


    for (
        let level = 1;
        level <= 10;
        level++
    ) {

        let pool =
            vocabularyData.filter(
                word =>
                    Number(word.level) === level
            );


        /*
         * If a level is missing,
         * use the complete vocabulary
         * as a fallback.
         */

        if (
            pool.length === 0
        ) {

            pool =
                vocabularyData;

        }


        let word =
            pool[
                Math.floor(
                    Math.random() *
                    pool.length
                )
            ];


        questions.push(
            createQuestion(
                word,
                level
            )
        );

    }

}


/* =====================================================
   CREATE QUESTION
===================================================== */

function createQuestion(
    word,
    level
) {

    /*
     * Three question styles:
     *
     * meaning
     * synonym
     * context
     */


    let type =
        level <= 3
            ? "meaning"
            : randomChoice(
                [
                    "meaning",
                    "synonym",
                    "context"
                ]
            );


    if (
        type === "synonym"
    ) {

        let correct =
            getCorrectMeaning(
                word
            );


        return {

            level:
                level,

            word:
                word,

            question:
                'Which word is closest in meaning to "' +
                word.word +
                '"?',

            answer:
                correct,

            explanation:
                getExplanation(
                    word
                )

        };

    }


    if (
        type === "context"
    ) {

        return createContextQuestion(
            word,
            level
        );

    }


    return createMeaningQuestion(
        word,
        level
    );

}


/* =====================================================
   MEANING QUESTION
===================================================== */

function createMeaningQuestion(
    word,
    level
) {

    let correct =
        getCorrectMeaning(
            word
        );


    let wrongAnswers =
        getWrongMeanings(
            word,
            3
        );


    let options =
        shuffle(
            [
                correct,
                ...wrongAnswers
            ]
        );


    return {

        level:
            level,

        word:
            word,

        question:
            'What does "' +
            word.word +
            '" mean?',

        answer:
            correct,

        options:
            options,

        explanation:
            getExplanation(
                word
            )

    };

}


/* =====================================================
   CONTEXT QUESTION
===================================================== */

function createContextQuestion(
    word,
    level
) {

    let example =
        word.example ||
        (
            "The student used the word " +
            word.word +
            " correctly."
        );


    /*
     * Replace the word with a blank.
     */

    let sentence =
        example.replace(
            new RegExp(
                "\\b" +
                escapeRegExp(
                    word.word
                ) +
                "\\b",
                "i"
            ),
            "_____"
        );


    /*
     * If the example doesn't
     * contain the word, create
     * a simple sentence.
     */

    if (
        sentence === example
    ) {

        sentence =
            "The student was " +
            word.word +
            " when answering the question.";

    }


    let correct =
        word.word;


    let wrongWords =
        getWrongWords(
            word,
            3
        );


    let options =
        shuffle(
            [
                correct,
                ...wrongWords
            ]
        );


    return {

        level:
            level,

        word:
            word,

        question:
            "Choose the word that best completes the sentence:<br><br>" +
            sentence,

        answer:
            correct,

        options:
            options,

        explanation:
            getExplanation(
                word
            )

    };

}


/* =====================================================
   CORRECT MEANING
===================================================== */

function getCorrectMeaning(
    word
) {

    if (
        word.meaning &&
        word.meaning.trim()
    ) {

        return word.meaning;

    }


    if (
        word.chinese &&
        word.chinese.trim()
    ) {

        return word.chinese;

    }


    /*
     * Fallback so the question
     * never breaks.
     */

    return (
        "the meaning of the word " +
        word.word
    );

}


/* =====================================================
   WRONG MEANINGS
===================================================== */

function getWrongMeanings(
    correctWord,
    count
) {

    let candidates =
        vocabularyData
            .filter(
                item =>
                    item.id !==
                    correctWord.id &&
                    (
                        item.meaning ||
                        item.chinese
                    )
            );


    candidates =
        shuffle(
            candidates.slice()
        );


    let results = [];


    for (
        let item of candidates
    ) {

        let meaning =
            getCorrectMeaning(
                item
            );


        if (
            meaning &&
            meaning !==
            getCorrectMeaning(
                correctWord
            )
        ) {

            results.push(
                meaning
            );

        }


        if (
            results.length >=
            count
        ) {

            break;

        }

    }


    /*
     * Safety fallback.
     */

    while (
        results.length < count
    ) {

        results.push(
            "another possible meaning"
        );

    }


    return results;

}


/* =====================================================
   WRONG WORDS
===================================================== */

function getWrongWords(
    correctWord,
    count
) {

    let candidates =
        vocabularyData
            .filter(
                item =>
                    item.id !==
                    correctWord.id
            );


    candidates =
        shuffle(
            candidates.slice()
        );


    return candidates
        .slice(
            0,
            count
        )
        .map(
            item =>
                item.word
        );

}


/* =====================================================
   EXPLANATION
===================================================== */

function getExplanation(
    word
) {

    let text = "";


    if (
        word.meaning
    ) {

        text +=
            "Meaning: " +
            word.meaning;

    }


    if (
        word.chinese
    ) {

        text +=
            "<br>中文： " +
            word.chinese;

    }


    if (
        word.example
    ) {

        text +=
            "<br><br>Example: " +
            word.example;

    }


    if (
        word.synonyms &&
        word.synonyms.length
    ) {

        text +=
            "<br><br>Synonyms: " +
            word.synonyms.join(
                ", "
            );

    }


    return text;

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    answered = false;


    let q =
        questions[
            currentQuestion
        ];


    if (!q) {

        return;

    }


    document
        .getElementById(
            "progressText"
        )
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    document
        .getElementById(
            "levelText"
        )
        .textContent =
        "Level " +
        q.level;


    let percentage =
        (
            (currentQuestion + 1) /
            questions.length
        ) * 100;


    document
        .getElementById(
            "progressBar"
        )
        .style.width =
        percentage + "%";


    document
        .getElementById(
            "questionText"
        )
        .innerHTML =
        q.question;


    let options =
        q.options ||
        [];


    /*
     * Meaning questions already have
     * options.
     *
     * Synonym questions need options.
     */

    if (
        !q.options
    ) {

        let correct =
            q.answer;


        let wrong =
            getWrongMeanings(
                q.word,
                3
            );


        options =
            shuffle(
                [
                    correct,
                    ...wrong
                ]
            );


        q.options =
            options;

    }


    let optionsContainer =
        document.getElementById(
            "options"
        );


    optionsContainer.innerHTML =
        "";


    options.forEach(
        function(option) {

            let button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.textContent =
                option;


            button.onclick =
                function() {

                    checkAnswer(
                        option,
                        button
                    );

                };


            optionsContainer.appendChild(
                button
            );

        }
    );


    document
        .getElementById(
            "feedback"
        )
        .className =
        "feedback";


    document
        .getElementById(
            "feedback"
        )
        .innerHTML =
        "";


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "none";

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
    selected,
    clickedButton
) {

    if (
        answered
    ) {

        return;

    }


    answered = true;


    let q =
        questions[
            currentQuestion
        ];


    let correct =
        selected ===
        q.answer;


    let buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(button) {

            button.disabled =
                true;


            if (
                button.textContent ===
                q.answer
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    if (
        correct
    ) {

        score++;


        clickedButton.classList.add(
            "correct"
        );


        showFeedback(
            true,
            "Correct! ✓",
            q.explanation
        );

    }

    else {

        clickedButton.classList.add(
            "wrong"
        );


        showFeedback(
            false,
            "Not quite.",
            'The correct answer is "' +
            q.answer +
            '".<br><br>' +
            q.explanation
        );

    }


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "block";

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
    correct,
    title,
    text
) {

    let feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        correct
            ? "feedback correct"
            : "feedback wrong";


    feedback.innerHTML =
        '<div class="feedback-title">' +
        title +
        "</div>" +
        "<div>" +
        text +
        "</div>";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        showResult();

        return;

    }


    showQuestion();

}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

    document
        .getElementById(
            "quiz"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "score"
        )
        .textContent =
        score +
        " / " +
        questions.length;


    let percentage =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if (
        percentage ===
        100
    ) {

        message =
            "Outstanding! Perfect score! 🌟";

    }

    else if (
        percentage >= 80
    ) {

        message =
            "Excellent work! Your vocabulary is getting stronger. 💪";

    }

    else if (
        percentage >= 60
    ) {

        message =
            "Good effort! Keep practising your vocabulary. 📚";

    }

    else {

        message =
            "Keep going! Every mistake is a chance to learn. 🌱";

    }


    document
        .getElementById(
            "resultMessage"
        )
        .textContent =
        message;

}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    questions = [];


    document
        .getElementById(
            "result"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "quiz"
        )
        .style.display =
        "block";


    createDailyQuestions();

    showQuestion();

}


/* =====================================================
   RANDOM CHOICE
===================================================== */

function randomChoice(
    array
) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(
    array
) {

    for (
        let i =
            array.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =====================================================
   ESCAPE REGEX
===================================================== */

function escapeRegExp(
    string
) {

    return String(
        string
    ).replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
