<!-- =================================
     LOAD VOCABULARY DATABASE
================================= -->

<script src="data/vocabulary.js"></script>



<script>

/* ==================================
   VARIABLES
================================== */

let dailyQuestions = [];

let currentQuestion = 0;

let score = 0;

let wrongAnswers = [];

let todayKey = "";


/* ==================================
   QUESTION TYPES
================================== */

const questionTypes = [

    "meaning",

    "synonym",

    "context",

    "cloze"

];


/* ==================================
   CREATE DAILY QUESTIONS
================================== */

function createDailyQuestions() {

    dailyQuestions = [];


    /*
       We want the difficulty
       to increase from Q1 to Q10.
    */


    for (
        let level = 1;
        level <= 10;
        level++
    ) {


        let candidates =
            vocabulary.filter(

                item =>
                    item.level === level

            );


        /*
           If there are no words
           at this level,
           find the nearest level.
        */

        if (
            candidates.length === 0
        ) {

            candidates =
                vocabulary.filter(

                    item =>
                        Math.abs(
                            item.level - level
                        ) <= 2

                );

        }


        if (
            candidates.length > 0
        ) {

            const word =

                candidates[
                    Math.floor(
                        Math.random() *
                        candidates.length
                    )
                ];


            dailyQuestions.push(word);

        }

    }


    /*
       If there are fewer than 10
       questions, fill them.
    */

    while (
        dailyQuestions.length < 10
    ) {

        const randomWord =

            vocabulary[
                Math.floor(
                    Math.random() *
                    vocabulary.length
                )
            ];


        dailyQuestions.push(
            randomWord
        );

    }


    /*
       Exactly 10
    */

    dailyQuestions =
        dailyQuestions.slice(0, 10);

}


/* ==================================
   SELECT QUESTION TYPE
================================== */

function selectQuestionType(word, index) {

    /*
       Q1-2:
       Meaning

       Q3-4:
       Synonym

       Q5-7:
       Context

       Q8-9:
       Cloze

       Q10:
       Challenge
    */


    if (index <= 1) {

        return "meaning";

    }


    if (index <= 3) {

        return "synonym";

    }


    if (index <= 6) {

        return "context";

    }


    if (index <= 8) {

        return "cloze";

    }


    return "challenge";

}


/* ==================================
   GET SIMILAR WORDS
================================== */

function getSimilarWords(
    correctWord,
    count = 3
) {

    let candidates =

        vocabulary.filter(

            item =>

                item.id !==
                    correctWord.id &&

                item.partOfSpeech ===
                    correctWord.partOfSpeech &&

                Math.abs(
                    item.level -
                    correctWord.level
                ) <= 2

        );


    /*
       If not enough,
       use same part of speech.
    */

    if (
        candidates.length < count
    ) {

        candidates =

            vocabulary.filter(

                item =>

                    item.id !==
                        correctWord.id &&

                    item.partOfSpeech ===
                        correctWord.partOfSpeech

            );

    }


    /*
       Last fallback
    */

    if (
        candidates.length < count
    ) {

        candidates =

            vocabulary.filter(

                item =>
                    item.id !==
                    correctWord.id

            );

    }


    candidates.sort(
        () => Math.random() - 0.5
    );


    return candidates.slice(
        0,
        count
    );

}


/* ==================================
   CREATE OPTIONS
================================== */

function createOptions(
    correctWord,
    type
) {

    let options = [];


    /*
       =================================
       MEANING QUESTION
       =================================
    */

    if (
        type === "meaning"
    ) {

        /*
           Correct answer is
           the meaning.

           Distractors are meanings
           from similar words.
        */

        options.push({

            text:
                correctWord.meaning,

            correct:
                true

        });


        const similar =
            getSimilarWords(
                correctWord,
                3
            );


        similar.forEach(
            word => {

                options.push({

                    text:
                        word.meaning,

                    correct:
                        false

                });

            }
        );

    }


    /*
       =================================
       SYNONYM
       =================================
    */

    else if (
        type === "synonym"
    ) {

        let correctSynonym =

            correctWord.synonyms &&
            correctWord.synonyms.length
                ? correctWord.synonyms[0]
                : correctWord.meaning;


        options.push({

            text:
                correctSynonym,

            correct:
                true

        });


        const similar =
            getSimilarWords(
                correctWord,
                3
            );


        similar.forEach(
            word => {

                let synonym =

                    word.synonyms &&
                    word.synonyms.length
                        ? word.synonyms[0]
                        : word.meaning;


                options.push({

                    text:
                        synonym,

                    correct:
                        false

                });

            }
        );

    }


    /*
       =================================
       CONTEXT / CLOZE
       =================================
    */

    else {

        /*
           Correct word
        */

        options.push({

            text:
                correctWord.word,

            correct:
                true

        });


        const similar =
            getSimilarWords(
                correctWord,
                3
            );


        similar.forEach(
            word => {

                options.push({

                    text:
                        word.word,

                    correct:
                        false

                });

            }
        );

    }


    /*
       Shuffle
    */

    options.sort(
        () => Math.random() - 0.5
    );


    return options.slice(0, 4);

}


/* ==================================
   CREATE QUESTION
================================== */

function createQuestion(
    word,
    index
) {

    const type =
        selectQuestionType(
            word,
            index
        );


    let questionText = "";


    /*
       ================================
       MEANING
       ================================
    */

    if (
        type === "meaning"
    ) {

        questionText =

            `What does
            <strong>${word.word}</strong>
            mean?`;

    }


    /*
       ================================
       SYNONYM
       ================================
    */

    else if (
        type === "synonym"
    ) {

        questionText =

            `Which word is closest
            in meaning to
            <strong>${word.word}</strong>?`;

    }


    /*
       ================================
       CONTEXT
       ================================
    */

    else if (
        type === "context"
    ) {

        /*
           Remove the target word
           from the example sentence.
        */

        let sentence =
            word.example;


        const regex =
            new RegExp(
                word.word,
                "gi"
            );


        sentence =
            sentence.replace(
                regex,
                "________"
            );


        questionText =

            `Choose the word that
            best completes the sentence:

            <br><br>

            <strong>
            ${sentence}
            </strong>`;

    }


    /*
       ================================
       CLOZE
       ================================
    */

    else if (
        type === "cloze"
    ) {

        let sentence =
            word.example;


        const regex =
            new RegExp(
                word.word,
                "gi"
            );


        sentence =
            sentence.replace(
                regex,
                "________"
            );


        questionText =

            `Complete the sentence
            with the most suitable word:

            <br><br>

            <strong>
            ${sentence}
            </strong>`;

    }


    /*
       ================================
       CHALLENGE
       ================================
    */

    else {

        let sentence =
            word.example;


        const regex =
            new RegExp(
                word.word,
                "gi"
            );


        sentence =
            sentence.replace(
                regex,
                "________"
            );


        questionText =

            `PSLE Vocabulary Challenge:

            <br><br>

            <strong>
            ${sentence}
            </strong>

            <br><br>

            Which word best fits
            the context?`;

    }


    return {

        word:
            word,

        type:
            type,

        question:
            questionText,

        options:
            createOptions(
                word,
                type
            )

    };

}


/* ==================================
   LOAD QUESTION
================================== */

function loadQuestion() {

    const word =
        dailyQuestions[
            currentQuestion
        ];


    const question =
        createQuestion(
            word,
            currentQuestion
        );


    /*
       QUESTION NUMBER
    */

    document.getElementById(
        "questionNumber"
    ).innerText =

        "Question " +

        (currentQuestion + 1) +

        " of 10";


    /*
       DIFFICULTY
    */

    document.getElementById(
        "difficulty"
    ).innerText =

        "Level " +
        word.level;


    /*
       PROGRESS
    */

    document.getElementById(
        "progressBar"
    ).style.width =

        (
            (currentQuestion + 1)
            / 10
            * 100
        ) + "%";


    /*
       TYPE
    */

    document.getElementById(
        "questionType"
    ).innerText =

        question.type;


    /*
       QUESTION
    */

    document.getElementById(
        "question"
    ).innerHTML =

        question.question;


    /*
       OPTIONS
    */

    const optionsContainer =
        document.getElementById(
            "options"
        );


    optionsContainer.innerHTML = "";


    question.options.forEach(
        (option, index) => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.innerText =

                String.fromCharCode(
                    65 + index
                ) +

                ". " +

                option.text;


            button.onclick =
                function() {

                    checkAnswer(
                        option,
                        word,
                        button
                    );

                };


            optionsContainer.appendChild(
                button
            );

        }
    );


    /*
       RESET FEEDBACK
    */

    document.getElementById(
        "feedback"
    ).className =
        "feedback";


    document.getElementById(
        "nextButton"
    ).style.display =
        "none";

}


/* ==================================
   CHECK ANSWER
================================== */

function checkAnswer(
    selected,
    correctWord,
    selectedButton
) {

    const buttons =
        document.querySelectorAll(
            ".option"
        );


    /*
       Disable all buttons
    */

    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    /*
       Correct
    */

    if (
        selected.correct
    ) {

        score++;


        selectedButton.classList.add(
            "correct"
        );


        document.getElementById(
            "feedback"
        ).className =

            "feedback correct-feedback";


        document.getElementById(
            "feedbackTitle"
        ).innerText =

            "✓ Correct!";

    }


    /*
       Wrong
    */

    else {

        selectedButton.classList.add(
            "wrong"
        );


        /*
           Highlight correct option
        */

        buttons.forEach(
            button => {

                /*
                   Compare displayed
                   text with correct word
                */

                if (
                    button.innerText
                        .toLowerCase()
                        .includes(
                            correctWord.word
                                .toLowerCase()
                        )
                ) {

                    button.classList.add(
                        "correct"
                    );

                }

            }
        );


        wrongAnswers.push(
            correctWord
        );


        document.getElementById(
            "feedback"
        ).className =

            "feedback wrong-feedback";


        document.getElementById(
            "feedbackTitle"
        ).innerText =

            "✗ Not quite";

    }


    /*
       Explanation
    */

    document.getElementById(
        "explanation"
    ).innerHTML =

        `<strong>
            ${correctWord.word}
        </strong>

        <br>

        ${correctWord.meaning}

        <br>

        中文：
        ${correctWord.chinese}

        <br><br>

        Example:

        ${correctWord.example}`;


    /*
       Show next
    */

    document.getElementById(
        "nextButton"
    ).style.display =
        "block";

}


/* ==================================
   NEXT QUESTION
================================== */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion <
        dailyQuestions.length
    ) {

        loadQuestion();

    }

    else {

        showResult();

    }

}


/* ==================================
   RESULT LEVEL
================================== */

function getResultLevel(score) {

    if (score === 10) {

        return "Vocabulary Master";

    }

    if (score >= 9) {

        return "Advanced";

    }

    if (score >= 8) {

        return "Strong";

    }

    if (score >= 6) {

        return "Developing";

    }

    if (score >= 4) {

        return "Foundation";

    }

    return "Keep Practising";

}


/* ==================================
   RESULT MESSAGE
================================== */

function getResultMessage(score) {

    if (score === 10) {

        return
            "Outstanding! You mastered today's challenge.";

    }


    if (score >= 8) {

        return
            "Excellent work! Your vocabulary is developing strongly.";

    }


    if (score >= 6) {

        return
            "Good effort! Review today's weak words and try again.";

    }


    if (score >= 4) {

        return
            "You are building your vocabulary. Keep practising every day.";

    }


    return
        "Don't worry. Daily practice will help you improve step by step.";

}


/* ==================================
   SHOW RESULT
================================== */

function showResult() {

    /*
       Hide quiz
    */

    document.getElementById(
        "quiz"
    ).style.display =
        "none";


    /*
       Show result
    */

    document.getElementById(
        "result"
    ).style.display =
        "block";


    /*
       Score
    */

    document.getElementById(
        "finalScore"
    ).innerText =

        score +
        " / 10";


    /*
       Level
    */

    document.getElementById(
        "resultLevel"
    ).innerText =

        getResultLevel(score);


    /*
       Message

       NOTE:
       Function may return undefined
       because of JavaScript ASI.

       So set directly below.
    */

    let message = "";


    if (score === 10) {

        message =
            "Outstanding! You mastered today's challenge.";

    }

    else if (score >= 8) {

        message =
            "Excellent work! Your vocabulary is developing strongly.";

    }

    else if (score >= 6) {

        message =
            "Good effort! Review today's weak words and try again.";

    }

    else if (score >= 4) {

        message =
            "You are building your vocabulary. Keep practising every day.";

    }

    else {

        message =
            "Don't worry. Daily practice will help you improve step by step.";

    }


    document.getElementById(
        "resultMessage"
    ).innerText =
        message;


    /*
       REVIEW
    */

    const reviewList =
        document.getElementById(
            "reviewList"
        );


    reviewList.innerHTML = "";


    /*
       Perfect
    */

    if (
        wrongAnswers.length === 0
    ) {

        reviewList.innerHTML =

            `<div class="perfect">

                🎉 Perfect!

                <br>

                You have no weak words
                from today's challenge.

            </div>`;

        return;

    }


    /*
       Remove duplicates
    */

    const uniqueWords = [];


    wrongAnswers.forEach(
        word => {

            if (
                !uniqueWords.some(
                    item =>
                        item.id === word.id
                )
            ) {

                uniqueWords.push(word);

            }

        }
    );


    /*
       Display mistakes
    */

    uniqueWords.forEach(
        word => {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "review-item";


            item.innerHTML =

                `<strong>
                    ${word.word}
                </strong>

                <br>

                ${word.meaning}

                <br>

                中文：
                ${word.chinese}

                <br><br>

                <small>

                Example:
                ${word.example}

                </small>`;


            reviewList.appendChild(
                item
            );

        }
    );

}


/* ==================================
   RESTART
================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    wrongAnswers = [];


    /*
       Create new Daily 10
    */

    createDailyQuestions();


    /*
       Reset screen
    */

    document.getElementById(
        "quiz"
    ).style.display =
        "block";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    loadQuestion();

}


/* ==================================
   START APPLICATION
================================== */

function startApp() {


    /*
       Check database
    */

    if (
        typeof vocabulary ===
        "undefined"
    ) {

        document.getElementById(
            "loading"
        ).innerHTML =

            "❌ Vocabulary database could not be loaded.<br><br>" +

            "Please check that this file exists:<br>" +

            "<strong>
                data/vocabulary.js
            </strong>";

        return;

    }


    /*
       Check database isn't empty
    */

    if (
        vocabulary.length === 0
    ) {

        document.getElementById(
            "loading"
        ).innerHTML =

            "❌ Vocabulary database is empty.";

        return;

    }


    /*
       Create today's questions
    */

    createDailyQuestions();


    /*
       Hide loading
    */

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    /*
       Show quiz
    */

    document.getElementById(
        "quiz"
    ).style.display =
        "block";


    /*
       Load Q1
    */

    loadQuestion();

}


/* ==================================
   RUN
================================== */

startApp();

</script>
