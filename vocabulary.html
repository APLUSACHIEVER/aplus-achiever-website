      content="width=device-width, initial-scale=1.0">

<title>APLUS ACHIEVER — Daily 10</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4faf7;

    color: #123c2d;

}


/* =====================================================
   HEADER
===================================================== */

header {

    height: 130px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 5%;

    border-top: 1px solid #ead6c8;

    border-bottom: 1px solid #e8efeb;

}

.logo {

    line-height: 1;

}

.logo-main {

    font-size: 34px;

    font-weight: 800;

    letter-spacing: 2px;

    color: #176448;

}

.logo-sub {

    margin-top: 14px;

    font-size: 16px;

    font-weight: 700;

    letter-spacing: 4px;

    color: #637c75;

}

.back-link {

    color: #087047;

    text-decoration: none;

    font-size: 16px;

    font-weight: 700;

}

.back-link:hover {

    text-decoration: underline;

}


/* =====================================================
   HERO
===================================================== */

.hero {

    text-align: center;

    padding:
        66px
        20px
        38px;

}

.badge {

    display: inline-block;

    padding:
        12px
        28px;

    border-radius: 30px;

    background: #dff2e9;

    color: #126448;

    font-size: 15px;

    font-weight: 800;

    letter-spacing: 1px;

}

.hero h1 {

    margin:

        0
        12px;

    font-size: 64px;

    line-height: 1;

    color: #123c2d;

}

.hero h1 span {

    color: #27a56b;

}

.hero p {

    margin: 0;

    font-size: 21px;

    color: #657c76;

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {

    width: min(1360px, 90%);

    margin:
        10px
        auto
        100px;

}

.card {

    background: white;

    border-radius: 32px;

    padding: 48px;

    box-shadow:
        0 18px 50px
        rgba(28, 80, 58, 0.08);

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 32px;

}

.progress-text {

    font-size: 16px;

    font-weight: 700;

    color: #57736a;

}

.level-text {

    font-size: 15px;

    font-weight: 800;

    color: #209261;

}


/* =====================================================
   PROGRESS
===================================================== */

.progress {

    width: 100%;

    height: 9px;

    background: #e7f0eb;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 42px;

}

.progress-bar {

    height: 100%;

    width: 10%;

    background: #28a66d;

    border-radius: 20px;

    transition:
        width 0.3s ease;

}


/* =====================================================
   QUESTION
===================================================== */

.question-label {

    font-size: 14px;

    font-weight: 800;

    color: #2ba06c;

    letter-spacing: 1.5px;

    margin-bottom: 14px;

}

.question {

    font-size: 32px;

    line-height: 1.5;

    font-weight: 700;

    color: #173d2f;

    margin-bottom: 34px;

}


/* =====================================================
   FILL-IN-THE-BLANK
===================================================== */

.question-blank {

    display: inline-block;

    min-width: 150px;

    height: 1.05em;

    margin:
        0
        8px;

    border-bottom:
        3px solid #27a56b;

    vertical-align:
        baseline;

}


/* =====================================================
   OPTIONS
===================================================== */

.options {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 16px;

}

.option {

    width: 100%;

    min-height: 76px;

    padding:
        18px
        24px;

    border:
        2px solid #dcebe4;

    border-radius: 16px;

    background: white;

    cursor: pointer;

    text-align: left;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 18px;

    font-weight: 600;

    color: #244a3c;

    transition:
        all 0.15s ease;

    /* Prevent browser text caret */
    user-select: none;

    -webkit-user-select: none;

}

.option:hover {

    border-color: #42ad7c;

    background: #f3fbf7;

    transform:
        translateY(-1px);

}

.option:focus {

    outline: none;

}

.option:focus-visible {

    outline:
        3px solid
        rgba(39, 165, 107, 0.25);

    outline-offset: 2px;

}

.option.correct {

    border-color: #239660;

    background: #e3f6ec;

    color: #126448;

}

.option.wrong {

    border-color: #d76868;

    background: #fff0f0;

    color: #a73535;

}

.option:disabled {

    cursor: default;

    transform: none;

}


/* =====================================================
   FEEDBACK
===================================================== */

.feedback {

    display: none;

    margin-top: 30px;

    padding:
        22px
        24px;

    border-radius: 16px;

    font-size: 17px;

    line-height: 1.6;

}

.feedback.correct {

    display: block;

    background: #eaf8f0;

    color: #176448;

}

.feedback.wrong {

    display: block;

    background: #fff1f1;

    color: #923c3c;

}

.feedback-title {

    font-size: 20px;

    font-weight: 800;

    margin-bottom: 7px;

}


/* =====================================================
   BUTTON ROW
===================================================== */

.button-row {

    display: flex;

    justify-content: flex-end;

    margin-top: 30px;

}

.next-button {

    display: none;

    border: none;

    background: #19895d;

    color: white;

    padding:
        15px
        30px;

    border-radius: 12px;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;

}

.next-button:hover {

    background: #11734d;

}


/* =====================================================
   RESULT
===================================================== */

#result {

    display: none;

    text-align: center;

    padding:
        30px
        10px;

}

.result-title {

    font-size: 38px;

    font-weight: 800;

    margin-bottom: 20px;

}

.score {

    font-size: 70px;

    font-weight: 800;

    color: #239966;

    margin-bottom: 15px;

}

.result-message {

    color: #637a72;

    margin-bottom: 35px;

.restart-button {

    background: #19895d;

    color: white;

    padding:
        15px
        30px;

    border-radius: 12px;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;

}

.restart-button:hover {

    background: #11734d;

/* =====================================================

===================================================== */

#errorBox {

    padding: 30px;

    border: 1px solid #efb2b2;

    color: #8b3030;

    font-size: 16px;

}

#errorBox strong {

    margin-bottom: 10px;

/* =====================================================
   LOADING
===================================================== */

#loading {

    padding:
        100px
        20px;

    font-size: 20px;

    color: #617970;

}

.spinner {

    width: 38px;

    height: 38px;

    margin:
        0
        auto

    border:

    border-top-color:
        #299d69;

    border-radius: 50%;

    animation:
        spin 0.8s linear infinite;

}

@keyframes spin {

    to {

<!-- =====================================================
     VOCABULARY DATABASE

     DO NOT CHANGE THIS FILE.
===================================================== -->

<script src="./data/vocabulary.js"></script>


<!-- =====================================================
     DAILY 10 ENGINE
===================================================== -->

<script>

"use strict";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let vocabularyData = [];

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =====================================================
   START APPLICATION
===================================================== */

window.addEventListener(
    "load",
    function () {

        setTimeout(
            initialiseApp,
            50
        );

    }
);


/* =====================================================
   INITIALISE APP
===================================================== */

function initialiseApp() {

    try {

        /*
         * vocabulary.js must create:
         *
         * window.vocabulary
         */

        if (!window.vocabulary) {

            throw new Error(
                "window.vocabulary is not available."
            );

        }


        if (!Array.isArray(window.vocabulary)) {

            throw new Error(
                "window.vocabulary is not an array."
            );

        }


        if (window.vocabulary.length === 0) {

            throw new Error(
                "The vocabulary database is empty."
            );

        }


        vocabularyData =
            window.vocabulary.filter(
                function(word) {

                    return (
                        word &&
                        word.word
                    );

                }
            );


        if (vocabularyData.length === 0) {

            throw new Error(
                "No valid vocabulary entries were found."
            );

        }


        console.log(
            "APLU​S vocabulary loaded:",
            vocabularyData.length,
            "words"
        );


        createDailyQuestions();


        showQuestion();


        document
            .getElementById("loading")
            .style.display =
            "none";


        document
            .getElementById("quiz")
            .style.display =
            "block";

    }

    catch (error) {

        console.error(
            "APLUS Daily 10 error:",
            error
        );

        showError(error);

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

    document
        .getElementById("loading")
        .style.display =
        "none";


    document
        .getElementById("quiz")
        .style.display =
        "none";


    document
        .getElementById("errorBox")
        .style.display =
        "block";


    document
        .getElementById("errorMessage")
        .innerHTML =

        "Please check that your GitHub files are arranged as:<br><br>" +

        "<strong>index.html</strong><br>" +

        "└── <strong>data/vocabulary.js</strong><br><br>" +

        "Technical message: " +

        escapeHTML(
            error.message
        );

}


/* =====================================================
   CREATE DAILY QUESTIONS
===================================================== */

function createDailyQuestions() {

    questions = [];


    /*
     * One question from each level.
     *
     * Level 1 → Level 10
     */

    for (
        let level = 1;
        level <= 10;
        level++
    ) {

        let pool =
            vocabularyData.filter(
                function(word) {

                    return (
                        Number(word.level) ===
                        level
                    );

                }
            );


        /*
         * If a level does not exist,
         * use the complete database.
         */

        if (pool.length === 0) {

            pool =
                vocabularyData;

        }


        let word =
            pool[
                Math.floor(
                    Math.random() *
                    pool.length
                )
            ];


        questions.push(
            createQuestion(
                word,
                level
            )
        );

    }

}


/* =====================================================
   CREATE QUESTION
===================================================== */

function createQuestion(
    word,
    level
) {

    /*
     * Levels 1–3:
     * meaning questions
     *
     * Levels 4–10:
     * mixed question types
     */

    let type =
        level <= 3
            ? "meaning"
            : randomChoice(
                [
                    "meaning",
                    "synonym",
                    "context"
                ]
            );


    if (type === "synonym") {

        return createSynonymQuestion(
            word,
            level
        );

    }


    if (type === "context") {

        return createContextQuestion(
            word,
            level
        );

    }


    return createMeaningQuestion(
        word,
        level
    );

}


/* =====================================================
   MEANING QUESTION
===================================================== */

function createMeaningQuestion(
    word,
    level
) {

    let correct =
        getCorrectMeaning(word);


    let wrongAnswers =
        getWrongMeanings(
            word,
            3
        );


    let options =
        shuffle(
            [
                correct,
                ...wrongAnswers
            ]
        );


    return {

        level: level,

        word: word,

        type: "meaning",

        question:
            'What does "' +
            escapeHTML(word.word) +
            '" mean?',

        answer: correct,

        options: options,

        explanation:
            getExplanation(word)

    };

}


/* =====================================================
   SYNONYM QUESTION
===================================================== */

function createSynonymQuestion(
    word,
    level
) {

    /*
     * For synonym questions,
     * the answer is the word's meaning.
     *
     * This keeps the question consistent
     * with the vocabulary database.
     */

    let correct =
        getCorrectMeaning(word);


    let wrongAnswers =
        getWrongMeanings(
            word,
            3
        );


    let options =
        shuffle(
            [
                correct,
                ...wrongAnswers
            ]
        );


    return {

        level: level,

        word: word,

        type: "synonym",

        question:
            'Which meaning is closest to "' +
            escapeHTML(word.word) +
            '"?',

        answer: correct,

        options: options,

        explanation:
            getExplanation(word)

    };

}


/* =====================================================
   CONTEXT QUESTION
===================================================== */

function createContextQuestion(
    word,
    level
) {

    /*
     * IMPORTANT:
     *
     * We always prefer the example supplied
     * in vocabulary.js.
     *
     * The vocabulary itself is NOT changed.
     */


    let example =
        typeof word.example === "string"
            ? word.example.trim()
            : "";


    let sentence = "";


    /*
     * Check whether the original example
     * actually contains the vocabulary word.
     */

    let wordPattern =
        new RegExp(
            "\\b" +
            escapeRegExp(word.word) +
            "\\b",
            "i"
        );


    if (
        example &&
        wordPattern.test(example)
    ) {

        /*
         * Replace ONLY the target word
         * with a proper visual blank.
         */

        sentence =
            escapeHTML(example).replace(
                new RegExp(
                    "\\b" +
                    escapeRegExp(word.word) +
                    "\\b",
                    "i"
                ),
                '<span class="question-blank">&nbsp;</span>'
            );

    }

    else {

        /*
         * IMPORTANT FIX
         *
         * Do NOT generate:
         *
         * The student was facilitate...
         *
         * because "facilitate" is a verb.
         *
         * Instead, use a sentence structure
         * appropriate for the word's part of speech.
         */

        let partOfSpeech =
            String(
                word.partOfSpeech || ""
            )
            .toLowerCase()
            .trim();


        if (
            partOfSpeech.includes("adjective")
        ) {

            sentence =
                "The student was " +
                '<span class="question-blank">&nbsp;</span>' +
                " when answering the question.";

        }

        else if (
            partOfSpeech.includes("verb")
        ) {

            sentence =
                "The teacher asked the student to " +
                '<span class="question-blank">&nbsp;</span>' +
                " the task.";

        }

        else if (
            partOfSpeech.includes("noun")
        ) {

            sentence =
                "The student showed great " +
                '<span class="question-blank">&nbsp;</span>' +
                " during the activity.";

        }

        else if (
            partOfSpeech.includes("adverb")
        ) {

            sentence =
                "The student answered the question " +
                '<span class="question-blank">&nbsp;</span>' +
                ".";

        }

        else {

            /*
             * Generic fallback
             */

            sentence =
                "The student used the word " +
                '<span class="question-blank">&nbsp;</span>' +
                " correctly.";

        }

    }


    /*
     * Context answer is the vocabulary word itself.
     */

    let correct =
        word.word;


    /*
     * Get three different vocabulary words
     * as distractors.
     */

    let wrongWords =
        getWrongWords(
            word,
            3
        );


    let options =
        shuffle(
            [
                correct,
                ...wrongWords
            ]
        );


    return {

        level: level,

        word: word,

        type: "context",

        question:
            "Choose the word that best completes the sentence:<br><br>" +
            sentence,

        answer: correct,

        options: options,

        explanation:
            getExplanation(word)

    };

}


/* =====================================================
   CORRECT MEANING
===================================================== */

function getCorrectMeaning(word) {

    if (
        word.meaning &&
        String(word.meaning).trim()
    ) {

        return String(
            word.meaning
        ).trim();

    }


    if (
        word.chinese &&
        String(word.chinese).trim()
    ) {

        return String(
            word.chinese
        ).trim();

    }


    return (
        "the meaning of the word " +
        word.word
    );

}


/* =====================================================
   WRONG MEANINGS
===================================================== */

function getWrongMeanings(
    correctWord,
    count
) {

    let candidates =
        vocabularyData.filter(
            function(item) {

                return (
                    item.id !==
                    correctWord.id
                    &&
                    (
                        item.meaning ||
                        item.chinese
                    )
                );

            }
        );


    candidates =
        shuffle(
            candidates.slice()
        );


    let results = [];


    for (
        let item of candidates
    ) {

        let meaning =
            getCorrectMeaning(item);


        if (
            meaning &&
            meaning !==
            getCorrectMeaning(
                correctWord
            )
        ) {

            results.push(
                meaning
            );

        }


        if (
            results.length >= count
        ) {

            break;

        }

    }


    /*
     * Safety fallback.
     */

    while (
        results.length < count
    ) {

        results.push(
            "another possible meaning"
        );

    }


    return results;

}


/* =====================================================
   WRONG WORDS
===================================================== */

function getWrongWords(
    correctWord,
    count
) {

    let candidates =
        vocabularyData.filter(
            function(item) {

                return (
                    item.id !==
                    correctWord.id
                );

            }
        );


    candidates =
        shuffle(
            candidates.slice()
        );


    let results = [];


    for (
        let item of candidates
    ) {

        if (
            item.word &&
            item.word !==
            correctWord.word
        ) {

            results.push(
                item.word
            );

        }


        if (
            results.length >= count
        ) {

            break;

        }

    }


    /*
     * Safety fallback
     */

    while (
        results.length < count
    ) {

        results.push(
            "another word"
        );

    }


    return results;

}


/* =====================================================
   EXPLANATION
===================================================== */

function getExplanation(word) {

    let text = "";


    if (word.meaning) {

        text +=
            "Meaning: " +
            escapeHTML(
                word.meaning
            );

    }


    if (word.chinese) {

        text +=
            "<br>中文： " +
            escapeHTML(
                word.chinese
            );

    }


    if (word.example) {

        text +=
            "<br><br>Example: " +
            escapeHTML(
                word.example
            );

    }


    if (
        word.synonyms &&
        Array.isArray(word.synonyms) &&
        word.synonyms.length
    ) {

        text +=
            "<br><br>Synonyms: " +
            word.synonyms
                .map(
                    function(item) {

                        return escapeHTML(
                            item
                        );

                    }
                )
                .join(", ");

    }


    return text;

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    answered = false;


    let q =
        questions[
            currentQuestion
        ];


    if (!q) {

        return;

    }


    /*
     * Progress text
     */

    document
        .getElementById("progressText")
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    /*
     * Level
     */

    document
        .getElementById("levelText")
        .textContent =
        "Level " +
        q.level;


    /*
     * Progress bar
     */

    let percentage =
        (
            (currentQuestion + 1) /
            questions.length
        ) * 100;


    document
        .getElementById("progressBar")
        .style.width =
        percentage + "%";


    /*
     * Question
     */

    document
        .getElementById("questionText")
        .innerHTML =
        q.question;


    /*
     * Options
     */

    let options =
        q.options || [];


    /*
     * Safety:
     * If an older question object does not have
     * options, generate them here.
     */

    if (!options.length) {

        if (q.type === "context") {

            options =
                shuffle(
                    [
                        q.answer,
                        ...getWrongWords(
                            q.word,
                            3
                        )
                    ]
                );

        }

        else {

            options =
                shuffle(
                    [
                        q.answer,
                        ...getWrongMeanings(
                            q.word,
                            3
                        )
                    ]
                );

        }


        q.options =
            options;

    }


    let optionsContainer =
        document.getElementById(
            "options"
        );


    optionsContainer.innerHTML =
        "";


    /*
     * Create buttons
     */

    options.forEach(
        function(option) {

            let button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "option";


            /*
             * textContent prevents HTML injection
             * from vocabulary options.
             */

            button.textContent =
                option;


            button.addEventListener(
                "click",
                function() {

                    checkAnswer(
                        option,
                        button
                    );

                }
            );


            optionsContainer.appendChild(
                button
            );

        }
    );


    /*
     * Reset feedback
     */

    let feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        "feedback";


    feedback.innerHTML =
        "";


    /*
     * Hide Next button
     */

    document
        .getElementById("nextButton")
        .style.display =
        "none";

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
    selected,
    clickedButton
) {

    if (answered) {

        return;

    }


    answered = true;


    let q =
        questions[
            currentQuestion
        ];


    let correct =
        selected ===
        q.answer;


    let buttons =
        document.querySelectorAll(
            ".option"
        );


    /*
     * Disable all options
     */

    buttons.forEach(
        function(button) {

            button.disabled =
                true;


            if (
                button.textContent ===
                q.answer
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    /*
     * Correct answer
     */

    if (correct) {

        score++;


        clickedButton.classList.add(
            "correct"
        );


        showFeedback(
            true,
            "Correct! ✓",
            q.explanation
        );

    }


    /*
     * Wrong answer
     */

    else {

        clickedButton.classList.add(
            "wrong"
        );


        showFeedback(
            false,
            "Not quite.",
            'The correct answer is "' +
            escapeHTML(q.answer) +
            '".<br><br>' +
            q.explanation
        );

    }


    /*
     * Show next button
     */

    document
        .getElementById("nextButton")
        .style.display =
        "block";

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
    correct,
    title,
    text
) {

    let feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        correct
            ? "feedback correct"
            : "feedback wrong";


    feedback.innerHTML =

        '<div class="feedback-title">' +

        title +

        "</div>" +

        "<div>" +

        text +

        "</div>";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        showResult();

        return;

    }


    showQuestion();

}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

    document
        .getElementById("quiz")
        .style.display =
        "none";


    document
        .getElementById("result")
        .style.display =
        "block";


    document
        .getElementById("score")
        .textContent =
        score +
        " / " +
        questions.length;


    let percentage =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if (percentage === 100) {

        message =
            "Outstanding! Perfect score! 🌟";

    }

    else if (percentage >= 80) {

        message =
            "Excellent work! Your vocabulary is getting stronger. 💪";

    }

    else if (percentage >= 60) {

        message =
            "Good effort! Keep practising your vocabulary. 📚";

    }

    else {

        message =
            "Keep going! Every mistake is a chance to learn. 🌱";

    }


    document
        .getElementById("resultMessage")
        .textContent =
        message;

}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    questions = [];


    document
        .getElementById("result")
        .style.display =
        "none";


    document
        .getElementById("quiz")
        .style.display =
        "block";


    createDailyQuestions();


    showQuestion();

}


/* =====================================================
   RANDOM CHOICE
===================================================== */

function randomChoice(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    for (
        let i =
            array.length - 1;

        i > 0;

        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =====================================================
   ESCAPE REGEX
===================================================== */

function escapeRegExp(string) {

    return String(
        string
    ).replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
