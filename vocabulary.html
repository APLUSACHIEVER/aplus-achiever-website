<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:

}


/* =========================
   HEADER
========================= */

.header {

    height: 110px;

    background: white;

    display: flex;

}

}

.logo-sub {

    margin-top: 8px;

    font-size: 15px;

    font-weight: 700;

    color: #80958d;
}

.back {

    color: #08734f;

    text-decoration: none;

    font-weight: 700;
}

.back:hover {

}


/* =========================
   HERO
========================= */

.hero {

    text-align: center;

    padding: 68px 20px 42px;
}

.badge {

    display: inline-block;

    background: #e1f3ea;

    color: #08734f;

    padding: 12px 27px;

    border-radius: 30px;

    font-size: 16px;

    letter-spacing: 1px;
}

.hero h1 {

    margin: 22px 0 10px;

}

.hero h1 span {

}

}


/* =========================
   MAIN CARD
========================= */

.container {

}

.card {

   LOADING
========================= */

.loading {

    min-height: 250px;

    align-items: center;

    text-align: center;

}

.spinner {

    border-radius: 50%;

    animation: spin 0.9s linear infinite;

    margin-bottom: 20px;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   ERROR
========================= */

.error-box {

    background: #fff4f2;

    border: 1px solid #f0c7c1;

    color: #a53c30;

    padding: 25px;

    text-align: center;
}

.error-box code {

    background: #fff;

    padding: 5px 8px;

    border-radius: 5px;

    font-family: monospace;
}


/* =========================
   TOP BAR
========================= */

.topbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}

.question-number {

    font-size: 18px;

    font-weight: 700;

}

    border-radius: 20px;

}


/* =========================
   PROGRESS
========================= */

.progress-area {

    margin-bottom: 38px;
}

.progress-background {

    width: 100%;

    height: 10px;

    background: #e8f0ec;

    border-radius: 20px;

    overflow: hidden;
}

.progress {

}

========================= */

.question-type {

.option:hover {

}

.option.correct {

    border-color: #2ca16b;

}

.option.wrong {

    background: #fff1ef;

    border-color: #e06b5d;

    color: #a53c30;
}

.option:disabled {

    transform: none;
}


/* =========================
   FEEDBACK
========================= */

    border-radius: 18px;

    display: none;

    line-height: 1.7;
}

.feedback.correct {

}

<script>

/* =====================================================
   APLUS DAILY 10
===================================================== */


/* -------------------------
   VARIABLES
------------------------- */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;

let wrongWords = [];


/* -------------------------
   QUESTION PLAN
------------------------- */

const questionPlan = [

    {
        type: "meaning",
        minLevel: 1,
        maxLevel: 2
    },

    {
        type: "meaning",
        minLevel: 1,
        maxLevel: 3
    },

    {
        type: "synonym",
        minLevel: 2,
        maxLevel: 4
    },

    {
        type: "synonym",
        minLevel: 3,
        maxLevel: 5
    },

    {
        type: "context",
        minLevel: 4,
        maxLevel: 6
    },

    {
        type: "context",
        minLevel: 5,
        maxLevel: 7
    },

    {
        type: "context",
        minLevel: 6,
        maxLevel: 8
    },

    {
        type: "cloze",
        minLevel: 7,
        maxLevel: 9
    },

    {
        type: "cloze",
        minLevel: 8,
        maxLevel: 10
    },

    {
        type: "challenge",
        minLevel: 9,
        maxLevel: 10
    }

];


/* =====================================================
   START
===================================================== */

window.addEventListener(
    "load",
    startApp
);


function startApp() {

    try {

        /* Check vocabulary.js */

        if (
            typeof vocabulary === "undefined"
        ) {

            throw new Error(
                "Vocabulary database was not found."
            );

        }


        if (
            !Array.isArray(vocabulary)
        ) {

            throw new Error(
                "Vocabulary database format is incorrect."
            );

        }


        if (
            vocabulary.length === 0
        ) {

            throw new Error(
                "Vocabulary database is empty."
            );

        }


        console.log(
            "Vocabulary loaded:",
            vocabulary.length
        );


        createDailyQuestions();


        if (
            questions.length === 0
        ) {

            throw new Error(
                "Unable to create today's questions."
            );

        }


        document
            .getElementById("loading")
            .style.display = "none";


        document
            .getElementById("quiz")
            .style.display = "block";


        showQuestion();

    }

    catch (error) {

        console.error(error);

        showError(error.message);

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    document
        .getElementById("loading")
        .style.display = "none";


    const errorBox =
        document.getElementById("error");


    errorBox.style.display = "block";


    errorBox.innerHTML = `

        <strong>
            ⚠️ Vocabulary could not be loaded
        </strong>

        <br><br>

        ${message}

        <br><br>

        Please make sure your GitHub files are arranged like this:

        <br><br>

        <code>
            vocabulary.html
        </code>

        <br>

        <code>
            data/vocabulary.js
        </code>

    `;

}


/* =====================================================
   CREATE DAILY QUESTIONS
===================================================== */

function createDailyQuestions() {

    questions = [];

    const usedIds = new Set();


    questionPlan.forEach(
        plan => {

            let candidates =
                vocabulary.filter(
                    word =>

                        word.level >=
                        plan.minLevel &&

                        word.level <=
                        plan.maxLevel &&

                        !usedIds.has(word.id)
                );


            /*
             * If not enough words exist
             * in this level range,
             * use any unused word.
             */

            if (
                candidates.length === 0
            ) {

                candidates =
                    vocabulary.filter(
                        word =>
                            !usedIds.has(word.id)
                    );

            }


            if (
                candidates.length === 0
            ) {

                return;

            }


            /*
             * Random word
             */

            const word =
                candidates[
                    Math.floor(
                        Math.random() *
                        candidates.length
                    )
                ];


            usedIds.add(word.id);


            const question =
                buildQuestion(
                    word,
                    plan.type
                );


            if (question) {

                questions.push(question);

            }

        }
    );


    /*
     * Make sure we have 10 questions.
     */

    while (
        questions.length < 10
    ) {

        const available =
            vocabulary.filter(
                word =>
                    !usedIds.has(word.id)
            );


        if (
            available.length === 0
        ) {

            break;

        }


        const word =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];


        usedIds.add(word.id);


        const question =
            buildQuestion(
                word,
                "meaning"
            );


        if (question) {

            questions.push(question);

        }

    }

}


/* =====================================================
   BUILD QUESTION
===================================================== */

function buildQuestion(
    word,
    type
) {

    if (
        !word
    ) {

        return null;

    }


    switch(type) {


        case "meaning":

            return buildMeaningQuestion(word);


        case "synonym":

            return buildSynonymQuestion(word);


        case "context":

            return buildContextQuestion(word);


        case "cloze":

            return buildClozeQuestion(word);


        case "challenge":

            return buildChallengeQuestion(word);


        default:

            return buildMeaningQuestion(word);

    }

}


/* =====================================================
   MEANING QUESTION
===================================================== */

function buildMeaningQuestion(word) {

    const correct =
        word.meaning ||
        `the meaning of the word "${word.word}"`;


    let distractors =
        vocabulary

            .filter(
                item =>
                    item.id !== word.id &&
                    item.meaning &&
                    item.meaning !== correct
            )

            .sort(
                () => Math.random() - 0.5
            )

            .slice(0, 3)

            .map(
                item =>
                    item.meaning
            );


    const options =
        shuffle([
            correct,
            ...distractors
        ]);


    return {

        type: "meaning",

        word: word,

        prompt:
            `What does <span class="word-highlight">${escapeHTML(word.word)}</span> mean?`,

        options: options,

        answer: correct,

        explanation:
            word.meaning ||
            "This is the meaning of the word."

    };

}


/* =====================================================
   SYNONYM QUESTION
===================================================== */

function buildSynonymQuestion(word) {

    /*
     * If no synonym exists,
     * automatically fall back to meaning.
     */

    if (
        !word.synonyms ||
        word.synonyms.length === 0
    ) {

        return buildMeaningQuestion(word);

    }


    const correct =
        word.synonyms[0];


    let distractors = [];


    vocabulary

        .filter(
            item =>
                item.id !== word.id &&
                item.synonyms &&
                item.synonyms.length > 0
        )

        .sort(
            () => Math.random() - 0.5
        )

        .forEach(
            item => {

                if (
                    distractors.length < 3
                ) {

                    const candidate =
                        item.synonyms[0];


                    if (
                        candidate !== correct &&
                        !distractors.includes(candidate)
                    ) {

                        distractors.push(
                            candidate
                        );

                    }

                }

            }
        );


    const options =
        shuffle([
            correct,
            ...distractors
        ]);


    return {

        type: "synonym",

        word: word,

        prompt:
            `Which word is closest in meaning to <span class="word-highlight">${escapeHTML(word.word)}</span>?`,

        options: options,

        answer: correct,

        explanation:
            `"${word.word}" is closest in meaning to "${correct}".`

    };

}


/* =====================================================
   CONTEXT QUESTION
===================================================== */

function buildContextQuestion(word) {

    let sentence =
        word.example ||
        "";


    /*
     * If the example contains
     * the target word,
     * hide it.
     */

    if (
        sentence
            .toLowerCase()
            .includes(
                word.word.toLowerCase()
            )
    ) {

        const regex =
            new RegExp(
                word.word,
                "gi"
            );


        sentence =
            sentence.replace(
                regex,
                "______"
            );

    }

    else {

        sentence =
            `The student was ______ when completing the challenging task.`;

    }


    const correct =
        word.word;


    let distractors =
        getDistractors(
            word,
            3
        );


    const options =
        shuffle([
            correct,
            ...distractors
        ]);


    return {

        type: "context",

        word: word,

        prompt:
            sentence,

        options: options,

        answer: correct,

        explanation:
            `The correct word is "${word.word}".`

    };

}


/* =====================================================
   CLOZE QUESTION
===================================================== */

function buildClozeQuestion(word) {

    return buildContextQuestion(
        word
    );

}


/* =====================================================
   CHALLENGE
===================================================== */

function buildChallengeQuestion(word) {

    /*
     * Advanced words use a
     * contextual question.
     */

    let sentence =
        word.example ||
        `The teacher discussed the ______ issue with the class.`;


    if (
        sentence
            .toLowerCase()
            .includes(
                word.word.toLowerCase()
            )
    ) {

        sentence =
            sentence.replace(
                new RegExp(
                    word.word,
                    "gi"
                ),
                "______"
            );

    }
    else {

        sentence =
            `Choose the best word to complete this sentence: The teacher described the issue as ______.`;

    }


    const correct =
        word.word;


    const distractors =
        getDistractors(
            word,
            3
        );


    return {

        type: "challenge",

        word: word,

        prompt:
            sentence,

        options:
            shuffle([
                correct,
                ...distractors
            ]),

        answer: correct,

        explanation:
            `${word.word}: ${word.meaning || "See the example sentence for context."}`

    };

}


/* =====================================================
   DISTRACTORS
===================================================== */

function getDistractors(
    word,
    amount
) {

    let candidates =
        vocabulary.filter(
            item =>
                item.id !== word.id
        );


    /*
     * Prefer nearby levels.
     */

    candidates.sort(
        (a, b) => {

            const da =
                Math.abs(
                    a.level -
                    word.level
                );

            const db =
                Math.abs(
                    b.level -
                    word.level
                );

            return da - db;

        }
    );


    const result = [];


    for (
        let item of candidates
    ) {

        if (
            result.length >= amount
        ) {

            break;

        }


        if (
            item.word !== word.word
        ) {

            result.push(
                item.word
            );

        }

    }


    return result;

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    answered = false;


    const q =
        questions[
            currentQuestion
        ];


    if (!q) {

        showResult();

        return;

    }


    const number =
        currentQuestion + 1;


    document
        .getElementById(
            "questionNumber"
        )
        .textContent =
            `Question ${number} of ${questions.length}`;


    document
        .getElementById(
            "level"
        )
        .textContent =
            `Level ${q.word.level}`;


    document
        .getElementById(
            "progress"
        )
        .style.width =
            `${(number / questions.length) * 100}%`;


    document
        .getElementById(
            "questionType"
        )
        .textContent =
            getQuestionTypeName(
                q.type
            );


    document
        .getElementById(
            "question"
        )
        .innerHTML =
            q.prompt;


    const options =
        document.getElementById(
            "options"
        );


    options.innerHTML = "";


    q.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.textContent =
                option;


            button.onclick =
                () =>
                    checkAnswer(
                        option,
                        button
                    );


            options.appendChild(
                button
            );

        }
    );


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        "feedback";


    feedback.innerHTML =
        "";


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
            "none";

}


/* =====================================================
   QUESTION TYPE NAME
===================================================== */

function getQuestionTypeName(type) {

    const names = {

        meaning:
            "WORD MEANING",

        synonym:
            "SYNONYM",

        context:
            "CONTEXT",

        cloze:
            "CLOZE",

        challenge:
            "PSLE CHALLENGE"

    };


    return (
        names[type] ||
        "VOCABULARY"
    );

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
    selected,
    clickedButton
) {

    if (answered) {

        return;

    }


    answered = true;


    const q =
        questions[
            currentQuestion
        ];


    const correct =
        selected === q.answer;


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        button => {

            button.disabled =
                true;


            if (
                button.textContent ===
                q.answer
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    if (correct) {

        score++;


        clickedButton.classList.add(
            "correct"
        );


        showFeedback(
            true,
            "Correct!",
            q.explanation
        );

    }

    else {

        clickedButton.classList.add(
            "wrong"
        );


        wrongWords.push(
            q.word
        );


        showFeedback(
            false,
            "Not quite.",
            `The correct answer is "${q.answer}". ${q.explanation}`
        );

    }


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
            "block";

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
    correct,
    title,
    text
) {

    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        correct
            ? "feedback correct"
            : "feedback wrong";


    feedback.innerHTML = `

        <div class="feedback-title">
            ${title}
        </div>

        <div>
            ${text}
        </div>

    `;

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        showResult();

        return;

    }


    showQuestion();

}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

    document
        .getElementById(
            "quiz"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "result"
        )
        .style.display =
            "block";


    document
        .getElementById(
            "score"
        )
        .textContent =
            `${score} / ${questions.length}`;


    const percentage =
        Math.round(
            score /
            questions.length *
            100
        );


    let message = "";


    if (
        percentage === 100
    ) {

        message =
            "Outstanding! Perfect score! 🌟";

    }

    else if (
        percentage >= 80
    ) {

        message =
            "Excellent work! Your vocabulary is getting stronger. 💪";

    }

    else if (
        percentage >= 60
    ) {

        message =
            "Good effort! Keep practising your weak words. 📚";

    }

    else {

        message =
            "Keep going! Every mistake is a chance to learn. 🌱";

    }


    document
        .getElementById(
            "resultMessage"
        )
        .textContent =
            message;


    saveWeakWords();


    showWeakWords();

}


/* =====================================================
   SAVE WEAK WORDS
===================================================== */

function saveWeakWords() {

    if (
        wrongWords.length === 0
    ) {

        return;

    }


    let saved = [];


    try {

        saved =
            JSON.parse(
                localStorage.getItem(
                    "aplusWeakWords"
                )
            ) || [];

    }

    catch(e) {

        saved = [];

    }


    wrongWords.forEach(
        word => {

            if (
                !saved.some(
                    item =>
                        item.id === word.id
                )
            ) {

                saved.push(word);

            }

        }
    );


    /*
     * Keep the latest 50 weak words.
     */

    saved =
        saved.slice(-50);


    localStorage.setItem(
        "aplusWeakWords",
        JSON.stringify(saved)
    );

}


/* =====================================================
   SHOW WEAK WORDS
===================================================== */

function showWeakWords() {

    const list =
        document.getElementById(
            "weakList"
        );


    let saved = [];


    try {

        saved =
            JSON.parse(
                localStorage.getItem(
                    "aplusWeakWords"
                )
            ) || [];

    }

    catch(e) {

        saved = [];

    }


    /*
     * Remove duplicates.
     */

    const unique = [];


    saved.forEach(
        word => {

            if (
                !unique.some(
                    item =>
                        item.id === word.id
                )
            ) {

                unique.push(word);

            }

        }
    );


    if (
        unique.length === 0
    ) {

        list.innerHTML =
            `<span class="weak-word">
                No weak words yet — great job!
            </span>`;

        return;

    }


    list.innerHTML =
        unique
            .slice(-20)
            .map(
                word =>
                    `<span class="weak-word">
                        ${escapeHTML(word.word)}
                    </span>`
            )
            .join("");

}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    wrongWords = [];

    questions = [];

    document
        .getElementById(
            "result"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "quiz"
        )
        .style.display =
            "block";


    createDailyQuestions();

    showQuestion();

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    return array.sort(
        () =>
            Math.random() - 0.5
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
