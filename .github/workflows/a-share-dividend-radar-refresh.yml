name: APLUS A-share Dividend Radar Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full A-share dividend database
        shell: python
        run: |
          import json, math, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          QUOTE="https://push2.eastmoney.com/api/qt/clist/get"
          DIV="https://datacenter-web.eastmoney.com/api/data/v1/get"
          cutoff=(datetime.now(timezone.utc).date()-timedelta(days=365)).isoformat()
          headers={"User-Agent":"Mozilla/5.0","Referer":"https://quote.eastmoney.com/"}

          def get_json(url, params):
              req=urllib.request.Request(url+"?"+urllib.parse.urlencode(params),headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.loads(r.read().decode("utf-8","ignore"))

          fs="m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23,m:0+t:81+s:2048"
          base={"pz":100,"po":1,"np":1,"fltt":2,"invt":2,"fid":"f12","fs":fs,
                "fields":"f2,f3,f4,f9,f12,f13,f14",
                "ut":"bd1d9ddb04089700cf9c27f6f7426281"}

          probe=get_json(QUOTE,{**base,"pn":1})
          total=int((probe.get("data") or {}).get("total") or 0)
          if total<=100:
              raise RuntimeError("全A股接口异常，拒绝使用100只快照")
          pages=math.ceil(total/100)
          stocks={}

          for pn in range(1,pages+1):
              q=get_json(QUOTE,{**base,"pn":pn})
              items=(q.get("data") or {}).get("diff") or []
              if not items and pn<pages:
                  raise RuntimeError(f"行情第{pn}页为空")
              for x in items:
                  code=str(x.get("f12") or "")
                  name=str(x.get("f14") or "")
                  if code and name:
                      stocks[code]={"code":code,"name":name,"price":x.get("f2"),
                                    "change":x.get("f4"),"changePct":x.get("f3"),"pe":x.get("f9")}
              print(f"行情 {pn}/{pages}: {len(items)}, unique={len(stocks)}")

          if len(stocks)<total:
              raise RuntimeError(f"全A股不完整：{len(stocks)}/{total}")

          div={}
          for pn in range(1,31):
              q=get_json(DIV,{"reportName":"RPT_SHAREBONUS_DET",
                "columns":"SECURITY_CODE,SECURITY_NAME_ABBR,PRETAX_BONUS_RMB,EX_DIVIDEND_DATE,ASSIGN_PROGRESS",
                "filter":f"(EX_DIVIDEND_DATE>='{cutoff}')","pageNumber":pn,"pageSize":500,
                "sortColumns":"EX_DIVIDEND_DATE","sortTypes":"-1","source":"WEB","client":"WEB"})
              items=(q.get("result") or {}).get("data") or []
              if not items: break
              for x in items:
                  code=str(x.get("SECURITY_CODE") or "")
                  date=str(x.get("EX_DIVIDEND_DATE") or "")[:10]
                  progress=str(x.get("ASSIGN_PROGRESS") or "")
                  cash=float(x.get("PRETAX_BONUS_RMB") or 0)/10
                  if code and date>=cutoff and "实施" in progress and cash>0:
                      div[code]=div.get(code,0)+cash
              if len(items)<500: break

          out=[]
          for code,r in stocks.items():
              price=float(r["price"]) if r["price"] not in (None,"-",0) else None
              change=float(r["change"]) if r["change"] not in (None,"-") else None
              chg=float(r["changePct"]) if r["changePct"] not in (None,"-") else None
              pe=float(r["pe"]) if r["pe"] not in (None,"-") else None
              dividend=round(div.get(code,0),4)
              y=round(dividend/price*100,4) if price and dividend>0 else None
              out.append({"code":code,"name":r["name"],"price":price,"change":change,
                          "changePct":chg,"yield":y,"pe":pe,"dividendTTM":dividend})

          if len(out)<total:
              raise RuntimeError(f"最终输出不完整：{len(out)}/{total}")

          payload={"generatedAt":datetime.now(timezone.utc).isoformat(),
                   "source":"Eastmoney public market/dividend data","cutoff":cutoff,
                   "count":len(out),"rows":out}
          with open("data/a-share-dividend-radar.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,separators=(",",":"))
          print(f"完成：{len(out)}只A股")

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a-share-dividend-radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh full A-share dividend radar database"
          git push
