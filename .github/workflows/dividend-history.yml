name: APLUS A-share Dividend History Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dividend-history.yml"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete 5-year A-share cash dividend history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          API = "https://datacenter-web.eastmoney.com/api/data/v1/get"
          YEARS = list(range(datetime.now(timezone.utc).year - 5, datetime.now(timezone.utc).year))
          HEADERS = {"User-Agent":"Mozilla/5.0","Referer":"https://data.eastmoney.com/yjfp/"}

          def fetch(year, page):
              params = {
                  "reportName":"RPT_SHAREBONUS_DET",
                  "columns":"SECURITY_CODE,SECURITY_NAME_ABBR,REPORT_DATE,NOTICE_DATE,PLAN_NOTICE_DATE,EX_DIVIDEND_DATE,PRETAX_BONUS_RMB,ASSIGN_PROGRESS",
                  "filter":f"(REPORT_DATE>='{year}-01-01')(REPORT_DATE<='{year}-12-31')",
                  "pageNumber":str(page),"pageSize":500,
                  "sortColumns":"REPORT_DATE,SECURITY_CODE","sortTypes":"1,1",
                  "source":"WEB","client":"WEB"
              }
              url=API+"?"+urllib.parse.urlencode(params)
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers=HEADERS)
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          return (json.loads(resp.read().decode("utf-8","ignore")).get("result") or {}).get("data") or []
                  except Exception:
                      if attempt==3: raise
                      time.sleep(2**attempt)
              return []

          rows=[]
          for year in YEARS:
              page=1
              count=0
              while True:
                  items=fetch(year,page)
                  if not items: break
                  for x in items:
                      code=str(x.get("SECURITY_CODE") or "").zfill(6)
                      report=str(x.get("REPORT_DATE") or "")[:10]
                      ex=str(x.get("EX_DIVIDEND_DATE") or "")[:10]
                      progress=str(x.get("ASSIGN_PROGRESS") or "")
                      try: cash=float(x.get("PRETAX_BONUS_RMB") or 0)
                      except Exception: continue
                      cash_per_share=cash/10.0
                      if not code or not report.startswith(str(year)) or not ex or cash_per_share<=0: continue
                      if progress and "实施" not in progress: continue
                      rows.append({
                          "code":code,
                          "name":str(x.get("SECURITY_NAME_ABBR") or ""),
                          "reportYear":str(year),
                          "cashDividendPerShare":round(cash_per_share,6),
                          "exDividendDate":ex,
                          "noticeDate":str(x.get("NOTICE_DATE") or x.get("PLAN_NOTICE_DATE") or "")[:10]
                      })
                      count+=1
                  if len(items)<500: break
                  page+=1
                  if page>100: raise RuntimeError(f"Unexpected pagination depth for {year}")
              print(f"{year}: {count} implemented cash distributions")

          unique={}
          for x in rows:
              unique[(x["code"],x["reportYear"],x["cashDividendPerShare"],x["exDividendDate"])]=x
          rows=sorted(unique.values(),key=lambda x:(x["code"],x["reportYear"],x["exDividendDate"]))
          year_counts={y:sum(1 for x in rows if x["reportYear"]==str(y)) for y in YEARS}
          if any(year_counts[y]==0 for y in YEARS):
              raise RuntimeError(f"Dividend history year coverage failed: {year_counts}")

          out={
              "generatedAt":datetime.now(timezone.utc).isoformat(),
              "source":"Eastmoney RPT_SHAREBONUS_DET — implemented cash distributions",
              "coverage":{"startYear":YEARS[0],"endYear":YEARS[-1],"years":YEARS},
              "count":len(rows),
              "yearCounts":year_counts,
              "rows":rows
          }
          with open("data/a-share-dividend-history.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,separators=(",",":"))
          print(f"A_SHARE_DIVIDEND_HISTORY_READY count={len(rows)} years={YEARS}")
          PY

      - name: Validate history database
        run: |
          python - <<'PY'
          import json
          with open("data/a-share-dividend-history.json",encoding="utf-8") as f:
              d=json.load(f)
          assert d["coverage"]["years"] == [2021,2022,2023,2024,2025], d["coverage"]
          assert d["count"] > 1000, d["count"]
          assert all(d["yearCounts"][str(y)] > 0 for y in d["coverage"]["years"])
          assert all(x["code"] and x["reportYear"] and x["cashDividendPerShare"] > 0 and x["exDividendDate"] for x in d["rows"])
          print("HISTORY_VALIDATION_OK", d["count"], d["yearCounts"])
          PY

      - name: Commit history database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a-share-dividend-history.json
          if git diff --cached --quiet; then
            echo "History database unchanged."
            exit 0
          fi
          git commit -m "chore: refresh A-share dividend history"
          git push
