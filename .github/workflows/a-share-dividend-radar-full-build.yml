name: APLUS A-share Dividend Radar Full Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full A-share database
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, time, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          QUOTE_URLS = [
              "https://push2.eastmoney.com/webguest/api/qt/clist/get",
              "https://82.push2.eastmoney.com/webguest/api/qt/clist/get",
              "https://73.push2.eastmoney.com/webguest/api/qt/clist/get",
              "https://push2delay.eastmoney.com/api/qt/clist/get",
              "http://80.push2.eastmoney.com/api/qt/clist/get",
          ]
          DIV = "https://datacenter-web.eastmoney.com/api/data/v1/get"
          FS = "m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23,m:0+t:81+s:2048"
          HEADERS = {"User-Agent":"Mozilla/5.0","Referer":"https://quote.eastmoney.com/"}

          def get_json(url, params, attempts=3):
              last = None
              full = url + "?" + urllib.parse.urlencode(params)
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(full, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read().decode("utf-8","ignore"))
                  except Exception as e:
                      last = e
                      if attempt < attempts:
                          wait = min(20, 2 ** (attempt - 1))
                          print(f"请求失败 {attempt}/{attempts}: {url} -> {e}; {wait}s 后重试")
                          time.sleep(wait)
              raise RuntimeError(f"请求失败 {url}: {last}")

          base = {"pz":100,"po":1,"np":1,"fltt":2,"invt":2,"fid":"f12","fs":FS,
                  "fields":"f2,f3,f4,f9,f12,f13,f14","ut":"bd1d9ddb04089700cf9c27f6f7426281"}

          probe = None
          used = None
          errors = []
          for url in QUOTE_URLS:
              try:
                  probe = get_json(url, {**base,"pn":1})
                  total = int((probe.get("data") or {}).get("total") or 0)
                  if total >= 1000:
                      used = url
                      break
                  errors.append(f"{url}: total={total}")
              except Exception as e:
                  errors.append(f"{url}: {e}")
          if used is None:
              raise RuntimeError("全A股行情接口探测失败: " + " | ".join(errors))

          total = int((probe.get("data") or {}).get("total") or 0)
          pages = math.ceil(total/100)
          stocks = {}
          for pn in range(1, pages+1):
              q = get_json(used, {**base,"pn":pn}, attempts=3)
              items = (q.get("data") or {}).get("diff") or []
              if not items and pn < pages:
                  raise RuntimeError(f"行情第{pn}页为空")
              for x in items:
                  code = str(x.get("f12") or "").zfill(6)
                  name = str(x.get("f14") or "")
                  if code and name:
                      stocks[code] = {
                          "code":code,"name":name,"price":x.get("f2"),
                          "change":x.get("f4"),"changePct":x.get("f3"),"pe":x.get("f9")
                      }
              if pn % 20 == 0 or pn == pages:
                  print(f"行情 {pn}/{pages}, unique={len(stocks)}")
              time.sleep(0.10)

          if len(stocks) < total:
              raise RuntimeError(f"全A股不完整：{len(stocks)}/{total}")

          cutoff = (datetime.now(timezone.utc).date() - timedelta(days=365)).isoformat()
          div = {}
          for pn in range(1,31):
              q = get_json(DIV, {
                  "reportName":"RPT_SHAREBONUS_DET",
                  "columns":"SECURITY_CODE,SECURITY_NAME_ABBR,PRETAX_BONUS_RMB,EX_DIVIDEND_DATE,ASSIGN_PROGRESS",
                  "filter":f"(EX_DIVIDEND_DATE>='{cutoff}')",
                  "pageNumber":pn,"pageSize":500,
                  "sortColumns":"EX_DIVIDEND_DATE","sortTypes":"-1",
                  "source":"WEB","client":"WEB"
              }, attempts=3)
              items = (q.get("result") or {}).get("data") or []
              if not items:
                  break
              for x in items:
                  code = str(x.get("SECURITY_CODE") or "").zfill(6)
                  date = str(x.get("EX_DIVIDEND_DATE") or "")[:10]
                  progress = str(x.get("ASSIGN_PROGRESS") or "")
                  try:
                      cash = float(x.get("PRETAX_BONUS_RMB") or 0) / 10.0
                  except Exception:
                      cash = 0.0
                  if code and date >= cutoff and "实施" in progress and cash > 0:
                      div[code] = div.get(code, 0.0) + cash
              if len(items) < 500:
                  break
              time.sleep(0.02)

          out = []
          for code, r in stocks.items():
              try: price = float(r["price"])
              except: price = None
              try: change = float(r["change"])
              except: change = None
              try: chgp = float(r["changePct"])
              except: chgp = None
              try: pe = float(r["pe"])
              except: pe = None
              d = round(div.get(code,0.0), 4)
              y = round(d/price*100, 4) if price and price > 0 and d > 0 else None
              out.append({
                  "code":code,"name":r["name"],"price":price,"change":change,
                  "changePct":chgp,"yield":y,"pe":pe,"dividendTTM":d,
                  "target45":round(d/0.045,4) if d>0 else None,
                  "target50":round(d/0.05,4) if d>0 else None,
                  "target60":round(d/0.06,4) if d>0 else None
              })

          if len(out) < 1000:
              raise RuntimeError(f"最终输出异常：{len(out)}")
          out.sort(key=lambda x: (-(x["yield"] if x["yield"] is not None else -1), x["code"]))

          payload = {
              "generatedAt":datetime.now(timezone.utc).isoformat(),
              "source":"Eastmoney public market/dividend data",
              "cutoff":cutoff,
              "count":len(out),
              "universe":"全A股",
              "defaultDisplay":50,
              "rows":out
          }
          with open("data/a-share-dividend-radar.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,separators=(",",":"))
          print(f"FULL_A_SHARE_DATABASE_READY count={len(out)} universe=全A股 defaultDisplay=50")

          PY

      - name: Build complete 5-year A-share cash dividend history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          API = "https://datacenter.eastmoney.com/api/data/v1/get"
          YEARS = list(range(datetime.now(timezone.utc).year - 5, datetime.now(timezone.utc).year))
          HEADERS = {"User-Agent":"Mozilla/5.0","Referer":"https://data.eastmoney.com/yjfp/"}

          def fetch(year, page):
              params = {
                  "reportName":"RPT_SHAREBONUS_DET",
                  "columns":"SECURITY_CODE,SECURITY_NAME_ABBR,REPORT_DATE,NOTICE_DATE,PLAN_NOTICE_DATE,EX_DIVIDEND_DATE,PRETAX_BONUS_RMB,ASSIGN_PROGRESS",
                  "filter":f"(REPORT_DATE>='{year}-01-01')(REPORT_DATE<='{year}-12-31')",
                  "pageNumber":str(page),"pageSize":"500",
                  "sortColumns":"REPORT_DATE,SECURITY_CODE","sortTypes":"1,1",
                  "source":"WEB","client":"WEB"
              }
              url=API+"?"+urllib.parse.urlencode(params)
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers=HEADERS)
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          return (json.loads(resp.read().decode("utf-8","ignore")).get("result") or {}).get("data") or []
                  except Exception:
                      if attempt==3: raise
                      time.sleep(2**attempt)
              return []

          rows=[]
          for year in YEARS:
              page=1
              count=0
              while True:
                  items=fetch(year,page)
                  if not items: break
                  for x in items:
                      code=str(x.get("SECURITY_CODE") or "").zfill(6)
                      report=str(x.get("REPORT_DATE") or "")[:10]
                      ex=str(x.get("EX_DIVIDEND_DATE") or "")[:10]
                      progress=str(x.get("ASSIGN_PROGRESS") or "")
                      try: cash=float(x.get("PRETAX_BONUS_RMB") or 0)
                      except Exception: continue
                      # PRETAX_BONUS_RMB is per 10 shares; convert to per-share.
                      cash_per_share=cash/10.0
                      if not code or not report.startswith(str(year)) or not ex or cash_per_share<=0: continue
                      if progress and "实施" not in progress: continue
                      rows.append({
                          "code":code,
                          "name":str(x.get("SECURITY_NAME_ABBR") or ""),
                          "reportYear":str(year),
                          "cashDividendPerShare":round(cash_per_share,6),
                          "exDividendDate":ex,
                          "noticeDate":str(x.get("NOTICE_DATE") or x.get("PLAN_NOTICE_DATE") or "")[:10]
                      })
                      count+=1
                  if len(items)<500: break
                  page+=1
                  if page>100: raise RuntimeError(f"Unexpected pagination depth for {year}")
              print(f"{year}: {count} implemented cash distributions")

          unique={}
          for x in rows:
              unique[(x["code"],x["reportYear"],x["cashDividendPerShare"],x["exDividendDate"])]=x
          rows=sorted(unique.values(),key=lambda x:(x["code"],x["reportYear"],x["exDividendDate"]))
          year_counts={y:sum(1 for x in rows if x["reportYear"]==str(y)) for y in YEARS}
          if any(year_counts[y]==0 for y in YEARS):
              raise RuntimeError(f"Dividend history year coverage failed: {year_counts}")

          out={
              "generatedAt":datetime.now(timezone.utc).isoformat(),
              "source":"Eastmoney RPT_SHAREBONUS_DET — implemented cash distributions",
              "coverage":{"startYear":YEARS[0],"endYear":YEARS[-1],"years":YEARS},
              "count":len(rows),
              "yearCounts":year_counts,
              "rows":rows
          }
          with open("data/a-share-dividend-history.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,separators=(",",":"))
          print(f"A_SHARE_DIVIDEND_HISTORY_READY count={len(rows)} years={YEARS}")
          PY

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a-share-dividend-radar.json
          if git diff --cached --quiet; then
            echo "Database unchanged"
          else
            git commit -m "chore: build full A-share dividend radar database"
            git push
          fi
