name: Dividend Radar Quote Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dividend-radar.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch latest A-share quotes
        env:
          QUOTE_URL: "https://push2.eastmoney.com/api/qt/ulist.np/get?secids=1.600031,1.600585,1.600507,1.600010,1.600350,1.600050&fields=f2,f3,f4,f12,f14,f162&pn=1&np=1&fltt=2&invt=2&ut=fa5fd1943c7b386f172d6893dbbd1d0c"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          url = os.environ["QUOTE_URL"]
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://quote.eastmoney.com/"
              }
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              raw = r.read().decode("utf-8")

          payload = json.loads(raw)
          diff = (payload.get("data") or {}).get("diff") or []

          quotes = {}
          for item in diff:
              ticker = str(item.get("f12") or "")
              if not ticker:
                  continue

              price = item.get("f2")
              change_pct = item.get("f3")
              change = item.get("f4")

              def num(v):
                  try:
                      return float(v)
                  except (TypeError, ValueError):
                      return None

              price = num(price)
              change_pct = num(change_pct)
              change = num(change)
              pe = num(item.get("f162"))

              if price is not None and price > 1000:
                  price /= 100
              if change is not None and abs(change) > 100:
                  change /= 100
              if change_pct is not None and abs(change_pct) > 50:
                  change_pct /= 100

              quotes[ticker] = {
                  "name": item.get("f14"),
                  "price": price,
                  "change": change,
                  "changePct": change_pct,
                  "pe": pe
              }

          out = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "Eastmoney public quote API",
              "quotes": quotes
          }

          os.makedirs("data", exist_ok=True)
          with open("data/dividend-radar-quotes.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          PY

      - name: Build complete 5-year A-share cash dividend history
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          API = "https://datacenter-web.eastmoney.com/api/data/v1/get"
          YEARS = list(range(datetime.now(timezone.utc).year - 5, datetime.now(timezone.utc).year))
          rows = []

          def fetch_page(year, page):
              params = {
                  "reportName": "RPT_SHAREBONUS_DET",
                  "columns": "SECURITY_CODE,SECURITY_NAME_ABBR,REPORT_DATE,NOTICE_DATE,PLAN_NOTICE_DATE,EX_DIVIDEND_DATE,PRETAX_BONUS_RMB",
                  "filter": f"(REPORT_DATE>='{year}-01-01')(REPORT_DATE<='{year}-12-31')",
                  "pageNumber": str(page),
                  "pageSize": "500",
                  "sortColumns": "REPORT_DATE,SECURITY_CODE",
                  "sortTypes": "1,1",
                  "source": "HSF10",
                  "client": "PC"
              }
              url = API + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://data.eastmoney.com/yjfp/"
              })
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          payload = json.loads(resp.read().decode("utf-8"))
                      return (payload.get("result") or {}).get("data") or []
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)
              return []

          for year in YEARS:
              page = 1
              year_rows = 0
              while True:
                  data = fetch_page(year, page)
                  if not data:
                      break
                  for item in data:
                      if not isinstance(item, dict):
                          continue
                      code = str(item.get("SECURITY_CODE") or "").strip()
                      name = str(item.get("SECURITY_NAME_ABBR") or "").strip()
                      report_date = str(item.get("REPORT_DATE") or "")[:10]
                      ex_date = str(item.get("EX_DIVIDEND_DATE") or "")[:10]
                      raw_div = item.get("PRETAX_BONUS_RMB")
                      try:
                          div = float(raw_div)
                      except (TypeError, ValueError):
                          continue
                      # Only implemented cash distributions with an ex-dividend date.
                      # Proposed/announced but not yet implemented plans are excluded.
                      if not code or not report_date.startswith(str(year)) or not ex_date or div <= 0:
                          continue
                      rows.append({
                          "code": code,
                          "name": name,
                          "reportYear": str(year),
                          "cashDividendPerShare": round(div, 6),
                          "exDividendDate": ex_date,
                          "noticeDate": str(item.get("NOTICE_DATE") or item.get("PLAN_NOTICE_DATE") or "")[:10]
                      })
                      year_rows += 1
                  if len(data) < 500:
                      break
                  page += 1
                  if page > 100:
                      raise RuntimeError(f"Unexpected pagination depth for {year}")
              print(f"{year}: {year_rows} implemented cash-dividend records")

          if not rows:
              raise RuntimeError("No dividend history records were fetched")

          # Deduplicate exact distribution records, then sort deterministically.
          unique = {}
          for x in rows:
              key = (x["code"], x["reportYear"], x["cashDividendPerShare"], x["exDividendDate"])
              unique[key] = x
          rows = sorted(unique.values(), key=lambda x: (x["code"], x["reportYear"], x["exDividendDate"]))

          by_year = {y: sum(1 for x in rows if x["reportYear"] == str(y)) for y in YEARS}
          if any(by_year[y] == 0 for y in YEARS):
              raise RuntimeError(f"Dividend history year coverage failed: {by_year}")

          out = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "Eastmoney RPT_SHAREBONUS_DET — implemented cash distributions",
              "coverage": {"startYear": YEARS[0], "endYear": YEARS[-1], "years": YEARS},
              "count": len(rows),
              "yearCounts": by_year,
              "rows": rows
          }

          os.makedirs("data", exist_ok=True)
          with open("data/a-share-dividend-history.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print(f"Saved {len(rows)} dividend records to data/a-share-dividend-history.json")
          PY

      - name: Commit quote and dividend history snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividend-radar-quotes.json data/a-share-dividend-history.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: refresh dividend radar data"
          git push
