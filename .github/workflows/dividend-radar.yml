name: Dividend Radar Quote Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dividend-radar.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch latest A-share quotes
        env:
          QUOTE_URL: "https://push2.eastmoney.com/api/qt/ulist.np/get?secids=1.600031,1.600585,1.600507,1.600010,1.600350,1.600050&fields=f2,f3,f4,f12,f14,f162&pn=1&np=1&fltt=2&invt=2&ut=fa5fd1943c7b386f172d6893dbbd1d0c"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          url = os.environ["QUOTE_URL"]
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://quote.eastmoney.com/"
              }
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              raw = r.read().decode("utf-8")

          payload = json.loads(raw)
          diff = (payload.get("data") or {}).get("diff") or []

          quotes = {}
          for item in diff:
              ticker = str(item.get("f12") or "")
              if not ticker:
                  continue

              price = item.get("f2")
              change_pct = item.get("f3")
              change = item.get("f4")

              def num(v):
                  try:
                      return float(v)
                  except (TypeError, ValueError):
                      return None

              price = num(price)
              change_pct = num(change_pct)
              change = num(change)
              const pe = num(item.get("f162"))

              if price is not None and price > 1000:
                  price /= 100
              if change is not None and abs(change) > 100:
                  change /= 100
              if change_pct is not None and abs(change_pct) > 50:
                  change_pct /= 100

              quotes[ticker] = {
                  "name": item.get("f14"),
                  "price": price,
                  "change": change,
                  "changePct": change_pct,
                  "pe": pe
              }

          out = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "Eastmoney public quote API",
              "quotes": quotes
          }

          os.makedirs("data", exist_ok=True)
          with open("data/dividend-radar-quotes.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit quote snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividend-radar-quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes."
            exit 0
          fi
          git commit -m "chore: refresh dividend radar quotes"
          git push
