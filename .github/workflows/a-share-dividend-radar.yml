name: APLUS A-share Dividend Radar

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/a-share-dividend-radar.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch A-share prices and TTM dividends
        shell: python
        run: |
          import json, time, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          API="https://datacenter-web.eastmoney.com/api/data/v1/get"
          QUOTE="https://push2.eastmoney.com/api/qt/ulist.np/get"
          today=datetime.now(timezone.utc).date()
          cutoff=(today-timedelta(days=365)).isoformat()

          def get_json(url, params):
              qs=urllib.parse.urlencode(params)
              req=urllib.request.Request(url+"?"+qs,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode("utf-8","ignore"))

          # 1) 全市场股票代码/名称/最新价/涨跌
          rows=[]
          for pn in range(1,13):
              data=get_json(QUOTE,{
                "fltt":"2","invt":"2","np":"1","fs":"m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23,m:0+t:81",
                "fields":"f2,f3,f4,f12,f14","pn":pn,"pz":500,"po":1,
                "fid":"f3","ut":"fa5fd1943c7b386f172d6893dbbd1d0c"
              })
              diff=(data.get("data") or {}).get("diff") or []
              if not diff: break
              for x in diff:
                  code=str(x.get("f12") or "")
                  name=str(x.get("f14") or "")
                  if code and name:
                      rows.append({"code":code,"name":name,"price":x.get("f2"),"changePct":x.get("f3"),"change":x.get("f4")})
              if len(diff)<500: break

          # Deduplicate by code.
          rows={r["code"]:r for r in rows}

          # 2) 拉取最近12个月分红明细，按股票代码累计现金分红。
          div={}
          for pn in range(1,31):
              data=get_json(API,{
                "reportName":"RPT_SHAREBONUS_DET","columns":"SECURITY_CODE,SECURITY_NAME_ABBR,PRETAX_BONUS_RMB,EX_DIVIDEND_DATE,ASSIGN_PROGRESS",
                "filter":f"(EX_DIVIDEND_DATE>='{cutoff}')",
                "pageNumber":pn,"pageSize":500,
                "sortColumns":"EX_DIVIDEND_DATE","sortTypes":"-1","source":"WEB","client":"WEB"
              })
              result=(data.get("result") or {})
              diff=result.get("data") or []
              if not diff: break
              for x in diff:
                  code=str(x.get("SECURITY_CODE") or "")
                  progress=str(x.get("ASSIGN_PROGRESS") or "")
                  date=str(x.get("EX_DIVIDEND_DATE") or "")[:10]
                  if not code or date<cutoff: continue
                  # 只累计已实施方案，避免把预案重复计入TTM。
                  if "实施" not in progress and "方案" in progress: continue
                  cash=float(x.get("PRETAX_BONUS_RMB") or 0)
                  if cash>0: div[code]=div.get(code,0)+cash/10.0
              if len(diff)<500: break

          out=[]
          for code,r in rows.items():
              d=div.get(code,0)
              price=float(r["price"]) if r.get("price") not in (None,"-",0) else None
              change=float(r["change"]) if r.get("change") not in (None,"-") else None
              chgp=float(r["changePct"]) if r.get("changePct") not in (None,"-") else None
              y=d/price*100 if price and d>0 else None
              out.append({"code":code,"name":r["name"],"price":price,"change":change,"changePct":chgp,"dividendTTM":round(d,4),"yield":round(y,4) if y is not None else None})

          payload={"generatedAt":datetime.now(timezone.utc).isoformat(),"source":"Eastmoney public market/dividend data","cutoff":cutoff,"rows":out}
          with open("data/a-share-dividend-radar.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,separators=(",",":"))

      - name: Commit updated radar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a-share-dividend-radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Update A-share dividend radar data"
          git push
