name: APLUS A-share Dividend Radar

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/a-share-dividend-radar.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch A-share prices, PE and TTM dividends
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          QUOTE="https://82.push2.eastmoney.com/api/qt/clist/get"
          DIV="https://datacenter-web.eastmoney.com/api/data/v1/get"
          today=datetime.now(timezone.utc).date()
          cutoff=(today-timedelta(days=365)).isoformat()
          headers={"User-Agent":"Mozilla/5.0","Referer":"https://quote.eastmoney.com/"}

          def get_json(url, params):
              qs=urllib.parse.urlencode(params)
              req=urllib.request.Request(url+"?"+qs,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode("utf-8","ignore"))

          # 沪深A股全市场；动态按 data.total 翻页，不限制100只。
          rows=[]
          page_size=100
          total=None
          pn=1
          max_pages=100
          while pn <= max_pages:
              data=get_json(QUOTE,{
                "pn":pn,"pz":page_size,"po":1,"np":1,"fltt":2,"invt":2,"fid":"f3",
                "fs":"m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23,m:0+t:81+s:2048",
                "fields":"f2,f3,f4,f9,f12,f13,f14",
                "ut":"bd1d9ddb04089700cf9c27f6f7426281"
              })
              data_section=data.get("data") or {}
              diff=data_section.get("diff") or []
              if total is None: total=int(data_section.get("total") or 0)
              if not diff: break
              for x in diff:
                  code=str(x.get("f12") or "")
                  name=str(x.get("f14") or "")
                  if code and name:
                      rows.append({
                        "code":code,"name":name,"price":x.get("f2"),
                        "changePct":x.get("f3"),"change":x.get("f4"),
                        "pe":x.get("f9"),"market":x.get("f13")
                      })
              if total and len(rows)>=total: break
              print(f"行情分页 pn={pn}, 本页={len(diff)}, 已累计={len(rows)}, total={total}")
              if len(diff)<page_size: break
              pn += 1
          if pn > max_pages:
              raise RuntimeError(f"全A股分页超过{max_pages}页，停止写入不完整数据")
          rows={r["code"]:r for r in rows}
          print(f"行情抓取完成：接口total={total}，去重后={len(rows)}")
          if total and len(rows) < total:
              raise RuntimeError(f"全A股数据不完整：接口total={total}，实际抓到={len(rows)}，停止写入旧/残缺数据")

          # 最近12个月已实施现金分红。
          div={}
          for pn in range(1,31):
              data=get_json(DIV,{
                "reportName":"RPT_SHAREBONUS_DET",
                "columns":"SECURITY_CODE,SECURITY_NAME_ABBR,PRETAX_BONUS_RMB,EX_DIVIDEND_DATE,ASSIGN_PROGRESS",
                "filter":f"(EX_DIVIDEND_DATE>='{cutoff}')",
                "pageNumber":pn,"pageSize":500,
                "sortColumns":"EX_DIVIDEND_DATE","sortTypes":"-1",
                "source":"WEB","client":"WEB"
              })
              diff=(data.get("result") or {}).get("data") or []
              if not diff: break
              for x in diff:
                  code=str(x.get("SECURITY_CODE") or "")
                  date=str(x.get("EX_DIVIDEND_DATE") or "")[:10]
                  progress=str(x.get("ASSIGN_PROGRESS") or "")
                  if not code or date<cutoff or "实施" not in progress: continue
                  cash=float(x.get("PRETAX_BONUS_RMB") or 0)/10.0
                  if cash>0: div[code]=div.get(code,0)+cash
              if len(diff)<500: break

          out=[]
          for code,r in rows.items():
              price=float(r["price"]) if r.get("price") not in (None,"-",0) else None
              change=float(r["change"]) if r.get("change") not in (None,"-") else None
              chgp=float(r["changePct"]) if r.get("changePct") not in (None,"-") else None
              pe=float(r["pe"]) if r.get("pe") not in (None,"-") else None
              d=round(div.get(code,0),4)
              y=round(d/price*100,4) if price and d>0 else None
              out.append({
                "code":code,"name":r["name"],"price":price,
                "change":change,"changePct":chgp,"yield":y,"pe":pe,
                "dividendTTM":d
              })

          payload={
            "generatedAt":datetime.now(timezone.utc).isoformat(),
            "source":"Eastmoney public market/dividend data",
            "cutoff":cutoff,
            "count":len(out),
            "rows":out
          }
          with open("data/a-share-dividend-radar.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,separators=(",",":"))

      - name: Commit updated radar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a-share-dividend-radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Update A-share dividend radar data"
          git push
