name: A-share dividend golden test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/a-share-dividend-golden-test.yml"

permissions:
  contents: write

jobs:
  golden-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch five golden stocks and build test data
        shell: python
        run: |
          import json, time
          from datetime import datetime, timezone
          import urllib.parse, urllib.request

          stocks = {
              "600036":"招商银行",
              "601398":"工商银行",
              "601939":"建设银行",
              "601288":"农业银行",
              "601728":"中国电信",
          }

          ENDPOINT = "https://datacenter-web.eastmoney.com/api/data/v1/get"

          def fetch(code):
              params = {
                  "reportName":"RPT_SHAREBONUS_DET",
                  "columns":"ALL",
                  "filter":f'(SECURITY_CODE="{code}")',
                  "pageSize":"100",
                  "pageNumber":"1",
                  "sortColumns":"EX_DIVIDEND_DATE",
                  "sortTypes":"-1",
              }
              url = ENDPOINT + "?" + urllib.parse.urlencode(params)
              last = None
              for _ in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=25) as r:
                          obj = json.loads(r.read().decode("utf-8"))
                      result = obj.get("result") or {}
                      if not isinstance(result, dict):
                          raise RuntimeError(f"{code}: invalid result shape: {type(result).__name__}")
                      return result.get("data") or []
                  except Exception as e:
                      last = str(e)
                      time.sleep(2)
              raise RuntimeError(f"{code}: {last}")

          cutoff_year = datetime.now(timezone.utc).year - 6
          out = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "purpose":"golden-test",
              "rule":"latest up to 5 complete dividend years; current incomplete year excluded",
              "unitCheck":"per-share cash dividend is independently parsed from IMPL_PLAN_PROFILE (10派X => X/10); PRETAX_BONUS_RMB is retained only as a raw comparison field",
              "stocks":{}
          }

          for code,name in stocks.items():
              raw = fetch(code)
              rows=[]
              for r in raw:
                  ex = str(r.get("EX_DIVIDEND_DATE") or "")[:10]
                  if len(ex)!=10:
                      continue
                  try:
                      y=int(ex[:4])
                  except Exception:
                      continue
                  if y < cutoff_year:
                      continue
                  profile = str(r.get("IMPL_PLAN_PROFILE") or "")
                  cash = None
                  if "10派" in profile and "元" in profile:
                      try:
                          cash = float(profile.replace(",", "").split("派",1)[1].split("元",1)[0]) / 10
                      except Exception:
                          cash = None
                  rows.append({
                      "code":code,
                      "name":r.get("SECURITY_NAME_ABBR") or name,
                      "exDividendDate":ex,
                      "noticeDate":str(r.get("NOTICE_DATE") or "")[:10],
                      "recordDate":str(r.get("RECORD_DATE") or "")[:10],
                      "reportDate":str(r.get("REPORT_DATE") or "")[:10],
                      "pretaxBonusRmbRaw":r.get("PRETAX_BONUS_RMB"),
                      "assignProgress":r.get("ASSIGN_PROGRESS"),
                      "planProfile":profile,
                      "cashDividendPerShareFromProfile":cash,
                  })
              out["stocks"][code]={"name":name,"count":len(rows),"rows":rows}

          with open("data/a-share-dividend-golden-test.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

          print(json.dumps(out,ensure_ascii=False)[:12000])

      - name: Validate golden test data
        shell: python
        run: |
          import json
          from collections import defaultdict
          from datetime import datetime, timezone

          path = "data/a-share-dividend-golden-test.json"
          with open(path,encoding="utf-8") as f:
              out=json.load(f)

          assert set(out["stocks"]) == {"600036","601398","601939","601288","601728"}

          current_year = datetime.now(timezone.utc).year
          for code, item in out["stocks"].items():
              assert item["count"] > 0, f"{code}: no dividend rows"
              annual=defaultdict(float)
              unit_checked=0
              for r in item["rows"]:
                  assert int(r["exDividendDate"][:4]) < current_year, f"{code}: current year leaked"
                  if r["cashDividendPerShareFromProfile"] is not None:
                      unit_checked += 1
                      raw=r["pretaxBonusRmbRaw"]
                      if raw is not None:
                          assert abs(float(raw)/10-r["cashDividendPerShareFromProfile"]) < 1e-6, f"{code}: unit mismatch"
                  report_year = str(r.get("reportDate") or "")[:4]
                  if report_year.isdigit() and int(report_year) < current_year and r["cashDividendPerShareFromProfile"] is not None:
                      annual[int(report_year)] += r["cashDividendPerShareFromProfile"]
              years=sorted(annual)
              assert len(years) >= 3, f"{code}: insufficient complete annual history"
              assert unit_checked >= 1, f"{code}: no independently parsed unit check"
              selected=years[-5:]
              assert all(y < current_year for y in selected)
              avg=sum(annual[y] for y in selected)/len(selected)
              assert avg > 0, f"{code}: invalid average dividend"
              print(code, item["name"], "years=", selected, "avg=", round(avg,6), "unit_checks=", unit_checked)

      - name: Commit golden test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a-share-dividend-golden-test.json
          git diff --cached --quiet && exit 0
          git commit -m "test: build five golden stock dividend dataset"
          git push
