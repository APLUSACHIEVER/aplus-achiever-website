<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APLUS ACHIEVER — Admin Dashboard</title>
<style>
:root{--g:#146b4f;--g2:#27a66d;--deep:#103e31;--muted:#6d817a;--line:#dcebe5;--bg:#f4f8f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#183f35;font-family:Inter,Arial,sans-serif}
.wrap{max-width:1250px;margin:auto;padding:25px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:950;color:var(--g);letter-spacing:.8px}
button{border:1px solid var(--line);background:#fff;color:var(--g);border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.danger{color:#a33;background:#fff6f6}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.stat b{display:block;color:var(--g);font-size:27px}.muted{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e7efec}th{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf7f1;color:var(--g);font-size:11px;font-weight:850}.attention{background:#fff6e4;color:#916313}.good{background:#eaf8f0;color:#176448}
#login{max-width:420px;margin:10vh auto}.hidden{display:none!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input{padding:10px;border:1px solid var(--line);border-radius:10px}
#studentDetail{margin-top:15px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
<script src="config/supabase-config.js"></script><script src="js/auth.js"></script>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
<div class="brand">APLUS ACHIEVER · OWNER / TEACHER</div>
<h1>Admin Dashboard</h1>
<p class="muted">Sign in with an account whose profile role is <b>admin</b> or <b>teacher</b>.</p>
<input id="email" type="email" placeholder="Email" style="width:100%;margin:5px 0">
<input id="password" type="password" placeholder="Password" style="width:100%;margin:5px 0">
<button style="width:100%" onclick="login()">Sign In</button><p id="loginMsg" class="muted"></p>
</div>

<div id="app" class="hidden">
<div class="top"><div><div class="brand">APLUS ACHIEVER</div><h1>AI Learning Analytics</h1><div id="who" class="muted"></div></div>
<div><button onclick="location.href='vocabulary.html'">Learning Site</button> <button onclick="logout()">Sign Out</button></div></div>

<div class="grid">
<div class="stat"><b id="students">0</b><span class="muted">Students</span></div>
<div class="stat"><b id="active">0</b><span class="muted">Active Today</span></div>
<div class="stat"><b id="questions">0</b><span class="muted">Questions</span></div>
<div class="stat"><b id="accuracy">0%</b><span class="muted">Overall Accuracy</span></div>
<div class="stat"><b id="attention">0</b><span class="muted">Need Attention</span></div>
</div>

<div class="card">
<h2>Students</h2>
<div class="toolbar"><input id="search" placeholder="Search student..." oninput="renderStudents()"><button onclick="loadAll()">Refresh</button><button onclick="exportCSV()">Export CSV</button></div>
<table><thead><tr><th>Student</th><th>Class</th><th>Questions</th><th>Accuracy</th><th>Mastered</th><th>Attention</th><th></th></tr></thead>
<tbody id="studentRows"></tbody></table>
</div>

<div id="studentDetail" class="card hidden"></div>
</div></div>

<script>
let profiles=[],attempts=[],vocab=[];
async function wait(){for(let i=0;i<60;i++){if(window.APLUS_AUTH)return;await new Promise(r=>setTimeout(r,250))}}
async function login(){
 await wait(); const r=await APLUS_AUTH.signIn(email.value,password.value);
 if(r.error){loginMsg.textContent=r.error.message;return}
 await init();
}
async function logout(){await APLUS_AUTH.signOut();location.reload()}
async function init(){
 await wait(); const u=await APLUS_AUTH.user();
 if(!u){document.getElementById('login').classList.remove('hidden');return}
 try{
   const p=await APLUS_AUTH.profile();
   if(!p || !['admin','teacher'].includes(p.role)){loginMsg.textContent='This account is not an admin/teacher account.';return}
   who.textContent='Signed in as '+p.full_name+' · '+p.role;
   login.classList.add('hidden');app.classList.remove('hidden');await loadAll();
 }catch(e){loginMsg.textContent=e.message}
}
async function loadAll(){
 const s=window.aplusSupabase;
 const [pr,at,vp]=await Promise.all([
  s.from('profiles').select('*').order('full_name'),
  s.from('attempts').select('*').order('created_at',{ascending:false}).limit(100000),
  s.from('vocabulary_progress').select('*').limit(100000)
 ]);
 profiles=pr.data||[];attempts=at.data||[];vocab=vp.data||[];
 const today=new Date().toISOString().slice(0,10);
 const active=new Set(attempts.filter(x=>x.created_at.slice(0,10)===today).map(x=>x.student_id));
 const cor=attempts.filter(x=>x.is_correct).length;
 const att=new Set(vocab.filter(x=>Number(x.mastery)<55||Number(x.wrong)>2).map(x=>x.student_id));
 students.textContent=profiles.filter(x=>x.role==='student').length;
 active.textContent=active.size;questions.textContent=attempts.length;
 accuracy.textContent=(attempts.length?Math.round(cor/attempts.length*100):0)+'%';attention.textContent=att.size;
 renderStudents();
}
function statsFor(id){
 const a=attempts.filter(x=>x.student_id===id),v=vocab.filter(x=>x.student_id===id);
 const correct=a.filter(x=>x.is_correct).length;
 return {q:a.length,acc:a.length?Math.round(correct/a.length*100):0,master:v.filter(x=>Number(x.mastery)>=90).length,
  attention:v.filter(x=>Number(x.mastery)<55||Number(x.wrong)>2).length};
}
function renderStudents(){
 const term=(search.value||'').toLowerCase();
 const rows=profiles.filter(p=>p.role==='student' && ((p.full_name||'').toLowerCase().includes(term)||(p.class_name||'').toLowerCase().includes(term))).map(p=>{
  const s=statsFor(p.id), badge=s.attention?'attention':'good';
  return `<tr><td><b>${escapeHtml(p.full_name)}</b><div class="muted">${escapeHtml(p.id.slice(0,8))}</div></td><td>${escapeHtml(p.class_name||'—')}</td><td>${s.q}</td><td>${s.acc}%</td><td>${s.master}</td><td><span class="badge ${badge}">${s.attention?'Needs Review':'On Track'}</span></td><td><button onclick="openStudent('${p.id}')">View</button></td></tr>`;
 }).join('');
 studentRows.innerHTML=rows||'<tr><td colspan="7">No students found.</td></tr>';
}
function openStudent(id){
 const p=profiles.find(x=>x.id===id), s=statsFor(id), a=attempts.filter(x=>x.student_id===id), v=vocab.filter(x=>x.student_id===id);
 const weak=v.filter(x=>Number(x.mastery)<90).sort((x,y)=>Number(x.mastery)-Number(y.mastery)).slice(0,12);
 studentDetail.classList.remove('hidden');
 studentDetail.innerHTML=`<h2>${escapeHtml(p.full_name)}</h2><div class="muted">${escapeHtml(p.class_name||'')} · ${escapeHtml(p.level||'')}</div>
 <div class="grid"><div class="stat"><b>${s.q}</b><span class="muted">Questions</span></div><div class="stat"><b>${s.acc}%</b><span class="muted">Accuracy</span></div><div class="stat"><b>${s.master}</b><span class="muted">Mastered</span></div><div class="stat"><b>${s.attention}</b><span class="muted">Attention Items</span></div><div class="stat"><b>${a.length?Math.round(a.reduce((x,y)=>x+(y.response_ms||0),0)/a.length/1000*10)/10:'0'}s</b><span class="muted">Avg Response</span></div></div>
 <div class="cols"><div><h3>Top Words to Strengthen</h3><table><tr><th>Word</th><th>Mastery</th><th>Accuracy</th></tr>${weak.map(x=>`<tr><td>${escapeHtml(x.word)}</td><td>${Math.round(x.mastery)}%</td><td>${x.seen?Math.round(x.correct/x.seen*100):0}%</td></tr>`).join('')}</table></div>
 <div><h3>Recent Attempts</h3><table><tr><th>Word</th><th>Result</th><th>Time</th></tr>${a.slice(0,12).map(x=>`<tr><td>${escapeHtml(x.word||'—')}</td><td>${x.is_correct?'✓':'✗'}</td><td>${x.response_ms?Math.round(x.response_ms/100)/10+'s':'—'}</td></tr>`).join('')}</table></div></div>
 <button onclick="studentDetail.classList.add('hidden')">Close</button>`;
 studentDetail.scrollIntoView({behavior:'smooth'});
}
function exportCSV(){
 const header=['Student','Class','Questions','Accuracy','Mastered','Attention'];
 const data=profiles.filter(p=>p.role==='student').map(p=>{const s=statsFor(p.id);return [p.full_name,p.class_name,s.q,s.acc+'%',s.master,s.attention?'Yes':'No']});
 const csv=[header,...data].map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='aplus-student-analytics.csv';a.click();URL.revokeObjectURL(url);
}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
init();
</script>
</body></html>
