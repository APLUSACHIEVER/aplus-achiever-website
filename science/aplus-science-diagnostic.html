<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APLUS PSLE Science — 30 Question Diagnostic</title><link rel="stylesheet" href="science.css"></head><body><main class="science-home"><div class="paper-top"><div><span class="eyebrow">APLUS ACHIEVER · PSLE SCIENCE</span><h1>30-Question Science Diagnostic</h1><p>Original APLUS practice set · 60 marks</p></div><div class="paper-badge">60 MARKS</div></div><div id="app"></div></main><script src="science-demo-question-bank-2026-20260918.js"></script><script>
(function(){const qs=window.APLUS_SCIENCE_DEMO_2026||[],app=document.getElementById("app"),answers={},start=Date.now();let i=0;
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function render(){const q=qs[i];if(!q)return finish();app.innerHTML='<div class="science-practice-head"><span>Question '+(i+1)+' / '+qs.length+'</span><span>'+q.marks+' marks · '+q.topic+'</span></div><section class="tile science-question"><div class="science-q-meta">'+q.subtopic+' · '+q.skill+' · '+q.difficulty+'</div><h2>'+esc(q.question)+'</h2><div class="science-options">'+q.options.map((o,n)=>'<button class="btn secondary science-option" data-v="'+String.fromCharCode(65+n)+'">'+String.fromCharCode(65+n)+'. '+esc(o)+'</button>').join("")+'</div></section>' ;app.querySelectorAll(".science-option").forEach(b=>b.onclick=()=>{answers[q.number]=b.dataset.v;i++;render()})}
function finish(){let score=0;qs.forEach(q=>{if(answers[q.number]===q.answer)score+=q.marks});let pct=Math.round(score/60*100);localStorage.setItem("APLUS_SCIENCE_DEMO_RESULT",JSON.stringify({score,max:60,pct,seconds:Math.round((Date.now()-start)/1000),at:Date.now()}));app.innerHTML='<section class="paper-empty"><span class="eyebrow">COMPLETE</span><h1>'+score+' / 60</h1><p>'+pct+'% · '+Math.round((Date.now()-start)/60000)+' min</p><div class="notice"><strong>What next?</strong><p>Your result has been saved on this device. The next version will connect every question to topic weakness, mistake patterns and targeted revision.</p></div><a class="btn primary" href="../science.html">Back to Science</a></section>'}render()})();
</script></body></html>
