<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>APLUS PSLE Science — Practice</title><link rel="stylesheet" href="science.css"></head><body><main class="science-home"><div id="practice"></div></main>
<script src="science-paper-inventory-batch01-20260918.js"></script><script src="science-paper-inventory-batch02-20260918.js"></script><script src="science-paper-inventory-batch03-20260918.js"></script><script src="science-engine-v1-20260918.js"></script><script src="science-question-bank-v1-20260918.js"></script><script src="science-practice-engine-v1-20260918.js"></script>
<script>
(function(){const id=new URLSearchParams(location.search).get("id"),E=window.APLUS_SCIENCE_ENGINE_V1,P=window.APLUS_SCIENCE_PRACTICE_V1,r=document.getElementById("practice"),paper=E&&E.getById(id),qs=P&&P.getQuestions(id);if(!paper){r.innerHTML="<div class='notice'>Paper not found.</div>";return}
if(!qs.length){r.innerHTML="<a href='papers.html'>← School Papers</a><h1>"+paper.school+" · "+paper.year+"</h1><div class='paper-empty'><h2>Question bank not yet attached</h2><p>The paper is catalogued. Add the authorised question data to the question bank and this page will become an online practice paper.</p></div>";return}
P.start(id);let i=0,answers={};function draw(){const q=qs[i];r.innerHTML="<a href='papers.html'>← School Papers</a><div class='paper-top'><div><span class='eyebrow'>QUESTION "+(i+1)+" / "+qs.length+"</span><h1>"+paper.school+" · "+paper.year+"</h1></div><div class='paper-badge'>"+(q.marks||0)+" MARKS</div></div><section class='tile'><strong>"+q.question+"</strong>"+(q.options||[]).map((o,n)=>"<button class='btn secondary' style='display:block;margin:10px 0;width:100%;text-align:left' data-v='"+String.fromCharCode(65+n)+"'>"+String.fromCharCode(65+n)+". "+o+"</button>").join("")+"<div id='next'></div></section>";r.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{answers[q.id]=b.dataset.v;P.answer(id,q.id,b.dataset.v);i++;i<qs.length?draw():finish()})}function finish(){const s=P.submit(id);r.innerHTML="<a href='papers.html'>← School Papers</a><div class='paper-empty'><h1>Practice Complete</h1><p>Score: "+(s?s.score:0)+" / "+(s?s.total:0)+"</p><a class='btn primary' href='progress.html'>View Progress</a></div>"}draw();})();
</script></body></html>
