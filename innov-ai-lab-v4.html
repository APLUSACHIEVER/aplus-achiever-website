<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APLUS AI Lab V4 — Smart Review Engine</title><style>:root{--g:#2f8f63;--d:#15352a;--s:#eef8f2;--l:#dcebe3;--m:#6b7c75}*{box-sizing:border-box}body{margin:0;background:#f6faf8;color:var(--d);font-family:Inter,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:32px 20px 60px}.brand{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--g)}h1{font-size:36px;margin:8px 0}.sub{color:var(--m);margin-bottom:28px}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(20,70,50,.05)}.tag{display:inline-block;background:var(--s);color:var(--g);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.q{font-size:22px;line-height:1.45;margin:20px 0}.opts{display:grid;gap:10px}.opt{border:1px solid var(--l);background:#fff;border-radius:12px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.opt:hover{border-color:var(--g);background:var(--s)}.opt:disabled{cursor:default}.feedback{display:none;margin-top:16px;padding:16px;border-radius:14px;background:var(--s);line-height:1.55}.feedback.bad{background:#fff3f3}.row{display:flex;justify-content:space-between;margin:10px 0;font-size:14px}.muted{color:var(--m)}.pill{padding:5px 9px;border-radius:999px;background:var(--s);font-size:12px}.timeline{margin-top:16px}.item{padding:11px 0;border-bottom:1px solid var(--l);font-size:13px}.item b{display:block;margin-bottom:3px}.btn{margin-top:16px;border:0;border-radius:12px;padding:11px 15px;background:var(--d);color:#fff;cursor:pointer}.btn.light{background:#edf4f0;color:var(--d)}.schedule{font-size:26px;font-weight:800;color:var(--g);margin:8px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><main class="wrap"><div class="brand">APLUS ACHIEVER · AI INNOVATION LAB</div><h1>V4 Smart Review Engine</h1><div class="sub">The system learns when a student should see a knowledge point again — not simply what question comes next.</div><div class="grid"><section class="card"><span class="tag" id="mode">Loading...</span><div class="q" id="q">Loading...</div><div class="opts" id="opts"></div><div class="feedback" id="feedback"></div><button class="btn light" id="next">Next Question</button></section><aside class="card"><div class="row"><span class="muted">Current streak</span><b id="streak">0</b></div><div class="row"><span class="muted">Due now</span><b id="due">0</b></div><div class="row"><span class="muted">Stable skills</span><b id="stable">0</b></div><h3>Next Review</h3><div class="schedule" id="schedule">—</div><div class="muted" id="reason">—</div><h3>Review Queue</h3><div class="timeline" id="queue"></div><button class="btn light" id="reset">Reset V4</button></aside></div></main><script src="innov-ai-engine-v4.js"></script><script>(function(){const E=window.APLUSAIEngineV4;let s=E.load(),cur=null,locked=false;const $=x=>document.getElementById(x);function render(){const z=E.summary(s);$('streak').textContent=z.streak;$('due').textContent=z.due;$('stable').textContent=z.stable;$('queue').innerHTML=E.upcoming(s).map(x=>'<div class="item"><b>'+x.question.area+' · '+x.question.skill+'</b><span class="muted">'+x.dueLabel+' · level '+x.item.level+' · '+x.item.correct+' correct / '+x.item.wrong+' wrong</span></div>').join('');}function loadQuestion(){locked=false;const x=E.selectNext(s);cur=x.question;$('mode').textContent=x.mode==='review'?'SMART REVIEW DUE':'PRACTICE';$('q').textContent=x.question.prompt;$('reason').textContent=x.reason;$('schedule').textContent=E.formatDue(E.load().items[x.question.id]?E.load().items[x.question.id].dueAt:Date.now());$('feedback').style.display='none';$('opts').innerHTML=x.question.options.map((o,i)=>'<button class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));}function answer(i){if(locked)return;locked=true;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);const out=E.answer(s,cur,i,{mode:$('mode').textContent==='SMART REVIEW DUE'?'review':'practice',fast:true});s=E.load();const f=$('feedback');f.style.display='block';f.className='feedback '+(out.correct?'':'bad');f.innerHTML=out.correct?'<b>Correct ✓</b><br>Good retention. The next interval is now <b>'+out.schedule.label+'</b>.':'<b>Review needed</b><br>This knowledge point returns <b>'+out.schedule.label+'</b> so the learner can reinforce it while the mistake is still fresh.';const item=out.item;$('schedule').textContent=out.schedule.label;$('reason').textContent='Review level '+item.level+' · '+item.status;render();}$('next').onclick=loadQuestion;$('reset').onclick=()=>{s=E.reset();render();loadQuestion()};render();loadQuestion();})();</script></body></html>
