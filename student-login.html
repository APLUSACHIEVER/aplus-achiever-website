<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APLUS ACHIEVER — Student Login</title>
<style>
body{margin:0;background:#f4f8f6;font-family:Inter,Arial,sans-serif;color:#183f35}
.wrap{max-width:460px;margin:9vh auto;padding:20px}
.card{background:#fff;border:1px solid #dcebe5;border-radius:22px;padding:30px;box-shadow:0 10px 30px rgba(20,74,56,.07)}
h1{color:#103e31;margin:8px 0}.brand{font-weight:900;color:#146b4f;letter-spacing:.8px}
input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border:2px solid #dceae4;border-radius:12px}
button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:12px;background:#146b4f;color:white;font-weight:800;cursor:pointer}
.secondary{background:white;color:#146b4f;border:1px solid #cfe2d9}
#msg{margin-top:12px;font-size:13px}
</style>
<script src="config/supabase-config.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="wrap"><div class="card">
<div class="brand">APLUS ACHIEVER · AI LEARNING SYSTEM</div>
<h1>Student Login</h1>
<p>Sign in to save your learning progress and allow your tutor to personalise future practice.</p>
<input id="name" placeholder="Student name (for new account)">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password" autocomplete="new-password">
<button onclick="signup()">Create Student Account</button>
<button class="secondary" onclick="login()">Sign In</button>
<div id="msg"></div>
</div></div>
<script>
function msg(x){document.getElementById('msg').textContent=x}
async function wait(){for(let i=0;i<60;i++){if(window.APLUS_AUTH)return;await new Promise(r=>setTimeout(r,250))}}
async function login(){await wait();const r=await APLUS_AUTH.signIn(email.value,password.value);if(r.error){msg(r.error.message);return}location.href='vocabulary.html'}
async function signup(){await wait();const r=await APLUS_AUTH.signUp(email.value,password.value,name.value);if(r.error){msg(r.error.message);return}msg(r.data?.session ? 'Account created and signed in. Opening your learning system…' : 'Account created. If email confirmation is enabled, confirm your email, then sign in.'); if(r.data?.session) setTimeout(()=>location.href='vocabulary.html',500)}
</script>
</body></html>
