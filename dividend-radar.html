<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APLUS 股息率雷达</title>
  <link rel="stylesheet" href="dividend-radar-v1.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">APLUS INVESTMENT TOOLS</p>
        <h1>股息率雷达</h1>
        <p class="subtitle">实时股价 + 自动股息率</p>
      </div>
      <div class="status-wrap">
        <span id="marketStatus" class="status">正在连接行情…</span>
        <span id="lastUpdated" class="updated">等待数据</span>
      </div>
    </header>

    <section class="notice">
      <strong>实时模式</strong>
      <span>交易时段自动刷新；股息率 = 最近年度现金分红 ÷ 当前股价。</span>
    </section>

    <section class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>股票</th>
              <th>现价</th>
              <th>涨跌</th>
              <th>年度股息</th>
              <th>股息率</th>
              <th>4.5%价格</th>
              <th>5%价格</th>
              <th>6%价格</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="radarBody"></tbody>
        </table>
      </div>
    </section>

    <section class="cards" id="summaryCards"></section>

    <footer>
      <p>行情来源：腾讯财经公开行情接口。行情数据仅供参考，不构成投资建议。</p>
      <p>本页面为独立新增模块，不修改 APLUS 现有页面。</p>
    </footer>
  </main>
  <script src="dividend-radar-v1.js"></script>
</body>
</html>
