<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>APLUS 股息率雷达</title>
<link rel="stylesheet" href="dividend-radar-v1.css">
</head>
<body>
<main class="page">
<header class="hero">
  <div>
    <p class="eyebrow">APLUS INVESTMENT TOOLS</p>
    <h1>股息率雷达</h1>
    <p class="subtitle">即时高股息 × 低PE分析</p>
  </div>
  <div class="status-wrap">
    <span id="marketStatus" class="status">正在连接行情…</span>
    <span id="lastUpdated" class="updated">等待数据</span>
  </div>
</header>
<section class="notice"><strong>自动模式</strong><span>后台行情自动更新；股息率 = 年度现金分红 ÷ 最新股价。</span></section>
<section class="table-card">
  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>股票</th><th>现价</th><th>涨跌</th><th>年度股息</th><th>股息率</th><th>动态PE</th><th>雷达分</th><th>稳定性</th>
        <th>4.5%价格</th><th>5%价格</th><th>6%价格</th><th>状态</th>
      </tr></thead>
      <tbody id="radarBody"></tbody>
    </table>
  </div>
</section>
<section class="cards" id="summaryCards"></section>
<footer>
  <p>行情由 GitHub Actions 后台定时抓取东方财富公开行情接口，再由本页面读取同源 JSON；避免手机浏览器直接跨域连接行情接口。</p>
  <p>本页面为独立 Dividend Radar 模块，不影响其他 APLUS 网页。</p>
</footer>
</main>
<script src="data/dividend-radar-dividends-v1.js"></script>\n<script src="dividend-radar-v4.js"></script>
</body>
</html>
